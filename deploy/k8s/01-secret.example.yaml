# EXAMPLE ONLY -- every value below is a placeholder. Do not `kubectl apply`
# this file as-is and do not commit a real, filled-in copy to source control.
# In a real deployment, generate this Secret out-of-band (a secrets
# manager's CSI driver, `kubectl create secret` from local files/env, a
# sealed-secrets/external-secrets controller, etc.) -- this file exists so
# `kubectl apply -f deploy/k8s/` has something to point at when trying the
# manifests out, and so every key each Deployment expects is documented in
# one place.
#
# Postgres itself is NOT one of these manifests -- see README.md: this
# assumes an existing reachable Postgres 16 (RDS, Cloud SQL, a StatefulSet
# you manage separately, etc.), the same "customer-supplied database"
# assumption the app's own external-DB-migration feature already makes.
# argusops_app/argusops_worker roles and RLS must already exist there (see
# db/init/*.sql) before pointing this Secret at it.
apiVersion: v1
kind: Secret
metadata:
  name: argusops-secrets
  namespace: argusops
type: Opaque
stringData:
  # argusops_app has no table ownership / BYPASSRLS -- see
  # db/init/argusops_app_role.sql. Used by api and ingest.
  DATABASE_URL_APP: "postgres://argusops_app:CHANGEME@postgres-host:5432/argusops?sslmode=require"
  # argusops_worker: BYPASSRLS, owns the materialized views -- see
  # db/init/argusops_worker_role.sql. Used only by worker.
  DATABASE_URL_WORKER: "postgres://argusops_worker:CHANGEME@postgres-host:5432/argusops?sslmode=require"
  # Superuser (or a role with CREATE/ALTER on the argusops database) --
  # used ONLY by the one-off migration Job (03-migration-job.yaml), never
  # by a long-running Deployment.
  DATABASE_URL_MIGRATE: "postgres://postgres:CHANGEME@postgres-host:5432/argusops?sslmode=require"
  # Encrypts secrets.PersistentEnvStore's rows (webhook/LLM/MCP secrets,
  # LDAP bind password, SAML SP key) when SECRETS_BACKEND=env (see
  # 02-configmap.yaml). Generate with: openssl rand -base64 32
  SECRETS_ENCRYPTION_KEY: "CHANGEME"
  # RSA keypair api uses to issue/verify session JWTs (AUTH_MODE=jwt, see
  # 04-api.yaml) -- generate with:
  #   openssl genrsa -out jwt_private.pem 2048
  #   openssl rsa -in jwt_private.pem -pubout -out jwt_public.pem
  JWT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    CHANGEME
    -----END PRIVATE KEY-----
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    CHANGEME
    -----END PUBLIC KEY-----
  # Used only by 08-backup-cronjob.yaml's daily pg_dump-to-S3 job. Prefer an
  # IAM role scoped to nothing but s3:PutObject on the backup bucket's
  # prefix over a long-lived user's keys; better still, use IRSA/Workload
  # Identity and drop these two keys (and the corresponding env vars in the
  # CronJob) entirely.
  BACKUP_AWS_ACCESS_KEY_ID: "CHANGEME"
  BACKUP_AWS_SECRET_ACCESS_KEY: "CHANGEME"
