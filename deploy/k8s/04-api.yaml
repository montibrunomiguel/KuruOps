# The api is stateless, so it runs as several replicas and can autoscale (see
# 11-availability.yaml). The one thing that used to pin it to a single replica was the
# local uploads directory -- a ReadWriteOnce volume: a second replica either could not
# mount it or silently got its own empty directory, so some analysts would not see
# attachments others uploaded. 02-configmap.yaml now sets UPLOAD_BACKEND=database, which
# keeps attachments in Postgres (table attachment_blobs): every replica sees every
# attachment, and no volume is mounted.
#
# That is a trade, not free: attachments live in the database (25 MB each at most) and
# its backups. A deployment with many or large attachments should configure S3/GCS under
# Settings -> Storage Integration, which takes precedence per tenant and keeps the bytes
# out of Postgres. Attachments uploaded to a local volume before switching stay readable
# only if that directory is still mounted (reads fall back to UPLOAD_DIR); to keep them,
# mount the old PVC read-only at /data/uploads while you migrate.
#
# api's own rate limiter, request timeout, and SSE fan-out are safe for multiple
# replicas (Postgres-backed / context-bounded / LISTEN-NOTIFY-based, respectively).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kuruops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # api/ingest/worker images already run as a non-root `kuruops` user
      # baked into the image itself (see backend/Dockerfile) -- runAsNonRoot
      # here just makes the kubelet refuse to start the pod if that ever
      # regresses, instead of silently running as root. seccompProfile at
      # the pod level applies to every container below unless a container
      # overrides it.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: kuruops-api:latest
          # This binary never writes to local disk with UPLOAD_BACKEND=database (grep
          # the backend for os.TempDir/CreateTemp -- there is none), so the rest of the image filesystem can be read-only:
          # a remote-code-execution bug in a dependency can no longer drop
          # a file anywhere on disk. dropping every Linux capability and
          # blocking privilege escalation are both no-ops for this binary's
          # actual behavior (it needs none of them) and only close off
          # exactly the kind of container-breakout technique a CVE in some
          # future dependency might otherwise get to use.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: kuruops-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: DATABASE_URL_APP
            - name: SECRETS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: SECRETS_ENCRYPTION_KEY
            # Client IDs come from the ConfigMap (envFrom above, not
            # confidential); only the matching secrets need pulling in
            # individually here. Omitted entirely (rather than left empty)
            # in a real deployment that doesn't use one of these OAuth
            # integrations -- config.Load treats an unset env var the same
            # as an empty one either way.
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: GOOGLE_OAUTH_CLIENT_SECRET
            - name: SLACK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: SLACK_CLIENT_SECRET
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: SLACK_SIGNING_SECRET
            - name: JWT_PRIVATE_KEY_PATH
              value: /app/keys/jwt_private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /app/keys/jwt_public.pem
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
          # readinessProbe: /healthz pings the database with a short timeout
          # and returns 503 if it's unreachable (see
          # internal/httpserver.HealthCheck) -- pulls the pod out of the
          # Service until it can actually serve a real request.
          # livenessProbe: deliberately NOT the same DB-dependent check --
          # /livez (internal/httpserver.Livez) is an unconditional 200 with
          # no downstream dependency. A liveness probe that also depends on
          # Postgres would make kubelet kill and restart every replica at
          # once on a brief DB blip, turning a transient outage into a
          # synchronized restart storm instead of just letting readiness
          # route around it.
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
      volumes:
        - name: jwt-keys
          secret:
            secretName: kuruops-secrets
            items:
              - key: JWT_PRIVATE_KEY
                path: jwt_private.pem
              - key: JWT_PUBLIC_KEY
                path: jwt_public.pem
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kuruops
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
