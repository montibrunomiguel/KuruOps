# uploads is ReadWriteOnce -- fine at replicas: 1 (the default below), but
# more than one api replica needs either a ReadWriteMany-capable
# StorageClass here, or switching Settings -> Storage to the S3 backend
# (already supported, see internal/blobstore) instead of local disk, so
# every replica sees the same attachments regardless of which one an
# analyst's request lands on.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argusops-uploads
  namespace: argusops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: argusops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # api/ingest/worker images already run as a non-root `argusops` user
      # baked into the image itself (see backend/Dockerfile) -- runAsNonRoot
      # here just makes the kubelet refuse to start the pod if that ever
      # regresses, instead of silently running as root.
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: argusops-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: argusops-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: argusops-secrets
                  key: DATABASE_URL_APP
            - name: SECRETS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: argusops-secrets
                  key: SECRETS_ENCRYPTION_KEY
            - name: JWT_PRIVATE_KEY_PATH
              value: /app/keys/jwt_private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /app/keys/jwt_public.pem
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
            - name: uploads
              mountPath: /data/uploads
          # /healthz pings the database with a short timeout and returns 503
          # if it's unreachable (see internal/httpserver.HealthCheck) -- a
          # real check, not just "the process is up".
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
      volumes:
        - name: jwt-keys
          secret:
            secretName: argusops-secrets
            items:
              - key: JWT_PRIVATE_KEY
                path: jwt_private.pem
              - key: JWT_PUBLIC_KEY
                path: jwt_public.pem
        - name: uploads
          persistentVolumeClaim:
            claimName: argusops-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: argusops
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
