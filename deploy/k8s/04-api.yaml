# uploads is ReadWriteOnce -- fine at replicas: 1 (the default below), but
# more than one api replica needs either a ReadWriteMany-capable
# StorageClass here, or switching Settings -> Storage to the S3 backend
# (already supported, see internal/blobstore) instead of local disk, so
# every replica sees the same attachments regardless of which one an
# analyst's request lands on.
#
# api's own rate limiter, request timeout, and SSE fan-out are already safe
# for multiple replicas (Postgres-backed / context-bounded / LISTEN-NOTIFY-
# based, respectively) -- the uploads PVC above is the ONLY thing actually
# blocking replicas: 1 -> 2+ here. To scale api once you're ready:
#   1. Settings -> Storage -> switch to the S3 (or GCS) backend and confirm
#      existing attachments were migrated/are reachable there.
#   2. Remove this PersistentVolumeClaim and the "uploads" volumeMount/
#      volume below (local disk is no longer used once Storage is S3/GCS).
#   3. Bump spec.replicas below.
# Skipping step 1-2 and just bumping replicas will schedule fine (a second
# ReadWriteOnce claim mount on a different node either fails to attach or,
# depending on your CSI driver, silently gives the second replica its own
# empty uploads directory) -- either way, some analysts silently can't see
# attachments other analysts uploaded, depending on which pod their request
# happened to land on.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kuruops-uploads
  namespace: kuruops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: kuruops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # api/ingest/worker images already run as a non-root `kuruops` user
      # baked into the image itself (see backend/Dockerfile) -- runAsNonRoot
      # here just makes the kubelet refuse to start the pod if that ever
      # regresses, instead of silently running as root.
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: kuruops-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: kuruops-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: DATABASE_URL_APP
            - name: SECRETS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: SECRETS_ENCRYPTION_KEY
            # Client IDs come from the ConfigMap (envFrom above, not
            # confidential); only the matching secrets need pulling in
            # individually here. Omitted entirely (rather than left empty)
            # in a real deployment that doesn't use one of these OAuth
            # integrations -- config.Load treats an unset env var the same
            # as an empty one either way.
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: GOOGLE_OAUTH_CLIENT_SECRET
            - name: SLACK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: SLACK_CLIENT_SECRET
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: SLACK_SIGNING_SECRET
            - name: JWT_PRIVATE_KEY_PATH
              value: /app/keys/jwt_private.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /app/keys/jwt_public.pem
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
            - name: uploads
              mountPath: /data/uploads
          # readinessProbe: /healthz pings the database with a short timeout
          # and returns 503 if it's unreachable (see
          # internal/httpserver.HealthCheck) -- pulls the pod out of the
          # Service until it can actually serve a real request.
          # livenessProbe: deliberately NOT the same DB-dependent check --
          # /livez (internal/httpserver.Livez) is an unconditional 200 with
          # no downstream dependency. A liveness probe that also depends on
          # Postgres would make kubelet kill and restart every replica at
          # once on a brief DB blip, turning a transient outage into a
          # synchronized restart storm instead of just letting readiness
          # route around it.
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
      volumes:
        - name: jwt-keys
          secret:
            secretName: kuruops-secrets
            items:
              - key: JWT_PRIVATE_KEY
                path: jwt_private.pem
              - key: JWT_PUBLIC_KEY
                path: jwt_public.pem
        - name: uploads
          persistentVolumeClaim:
            claimName: kuruops-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: kuruops
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
