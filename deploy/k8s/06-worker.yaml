# Two replicas, so a node drain or a crash never stops the sweeps (SLA breaches,
# escalations, stale-run cleanup, retention, dashboard refresh). Every sweep tick takes
# a non-blocking Postgres advisory lock (db.Pool.WithAdvisoryLock, cmd/worker/main.go's
# runLocked): whichever replica gets it runs the tick and the other skips, and if one
# dies the survivor simply wins the next tick. So the second replica is a hot standby,
# not extra throughput -- more than two buys nothing.
#
# Only the replica that wins a tick refreshes its own
# kuruops_worker_last_sweep_success_timestamp, so a healthy standby's series is always
# stale; the KuruOpsWorkerSweepStale rule (09-monitoring.yaml) therefore alerts on the
# max across replicas, never on a single pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kuruops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: kuruops-worker:latest
          # See 04-api.yaml's securityContext comment -- same reasoning.
          # worker's only disk interaction is via kuruops_worker's Postgres
          # connection, never the local filesystem.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: kuruops-config
          env:
            # kuruops_worker: BYPASSRLS, owns the materialized views --
            # see db/init/kuruops_worker_role.sql. Never kuruops_app here.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: DATABASE_URL_WORKER
            - name: SECRETS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: SECRETS_ENCRYPTION_KEY
          # worker's only HTTP surface is /healthz + /livez + /metrics (see
          # cmd/worker/main.go) -- it serves no application traffic.
          # readinessProbe is DB-dependent (/healthz), livenessProbe
          # deliberately isn't (/livez) -- see 04-api.yaml's comment for why.
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: kuruops
spec:
  selector:
    app: worker
  ports:
    - port: 8080
      targetPort: 8080
