# Exactly one replica -- worker's periodic sweeps are already made safe
# under more than one replica via Postgres advisory locks (see
# db.Pool.WithAdvisoryLock, cmd/worker/main.go's runLocked), but nothing in
# this manifest set NEEDS more than one; scale up only if a single
# replica's sweep latency becomes an actual bottleneck.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kuruops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: kuruops-worker:latest
          # See 04-api.yaml's securityContext comment -- same reasoning.
          # worker's only disk interaction is via kuruops_worker's Postgres
          # connection, never the local filesystem.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: kuruops-config
          env:
            # kuruops_worker: BYPASSRLS, owns the materialized views --
            # see db/init/kuruops_worker_role.sql. Never kuruops_app here.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: DATABASE_URL_WORKER
            - name: SECRETS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: SECRETS_ENCRYPTION_KEY
          # worker's only HTTP surface is /healthz + /livez + /metrics (see
          # cmd/worker/main.go) -- it serves no application traffic.
          # readinessProbe is DB-dependent (/healthz), livenessProbe
          # deliberately isn't (/livez) -- see 04-api.yaml's comment for why.
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: kuruops
spec:
  selector:
    app: worker
  ports:
    - port: 8080
      targetPort: 8080
