# An example cert-manager ClusterIssuer for 12-ingress.yaml: free certificates from Let's
# Encrypt, issued and renewed automatically. Optional -- if you bring your own certificate,
# create the kuruops-tls Secret yourself and skip this.
#
# Prerequisites: cert-manager installed in the cluster
# (https://cert-manager.io/docs/installation/), the ingress host resolving publicly to the
# controller, and port 80 reachable for the HTTP-01 challenge. Start with the staging issuer
# (untrusted certificates, generous rate limits) until the whole flow works, then switch the
# Ingress annotation to `letsencrypt` (production), which is rate limited.
#
# Set `email` to an address that receives expiry notices.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: security@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
