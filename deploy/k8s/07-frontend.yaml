# API_UPSTREAM tells nginx (frontend/nginx.conf, rendered at container start)
# where the api lives. It must be the Service's FQDN, not the short name "api":
# nginx resolves the upstream per request through its own resolver (so a
# recreated api is picked up instead of 502ing), and that resolver does not
# apply the pod's DNS search domains. Change "cluster.local" if your cluster
# uses a different domain. The resolver itself is read from the pod's
# /etc/resolv.conf (kube-dns), nothing to configure for it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kuruops
spec:
  # 2 so a node drain or a rolling update never leaves the UI unserved
  # (11-availability.yaml keeps it between 2 and 4).
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # nginxinc/nginx-unprivileged already runs as uid 101 out of the box
      # (see frontend/Dockerfile) -- runAsNonRoot here is the same
      # belt-and-suspenders check as the backend Deployments.
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: kuruops-frontend:latest
          env:
            - name: API_UPSTREAM
              value: http://api.kuruops.svc.cluster.local:8080
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kuruops
spec:
  # ClusterIP is deliberate -- there's no ingress manifest here (see
  # README.md's scope note), so reaching this from outside the cluster is
  # left to whatever the operator already uses (a cloud LB Service, an
  # ingress controller, port-forward for a quick look). Swap type: LoadBalancer
  # here if that's all you need.
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
