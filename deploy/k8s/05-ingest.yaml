# Unlike api (see 04-api.yaml's PVC comment), ingest has no local-disk
# dependency at all -- it never touches uploaded attachments -- and its
# webhook-ingest rate limiter (webhook_ip, see
# internal/httpserver/middleware/ratelimit.go) is already Postgres-backed
# specifically so it counts correctly across replicas. 2 replicas here is
# the assisted-production starting point for basic availability (a single
# pod restart no longer means a brief window of dropped/refused inbound
# webhooks); bump further once you have real throughput numbers to size
# against (see docs/OPERATIONS.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: kuruops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ingest
          image: kuruops-ingest:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: kuruops-config
          env:
            # kuruops_app, same role/secret key api uses -- see
            # db/init/kuruops_app_role.sql, ingest's own webhook-ingest
            # path is RLS-scoped exactly like api's.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: DATABASE_URL_APP
            - name: SECRETS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: kuruops-secrets
                  key: SECRETS_ENCRYPTION_KEY
          # readinessProbe is DB-dependent (/healthz), livenessProbe
          # deliberately isn't (/livez) -- see 04-api.yaml's comment for why.
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
  namespace: kuruops
spec:
  selector:
    app: ingest
  ports:
    - port: 8080
      targetPort: 8080
