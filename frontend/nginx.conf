server {
    listen 80;
    # Without this, "wget http://localhost/" inside the container fails --
    # nginx's own IPv6-listen-enable script only patches the *unmodified*
    # packaged default.conf, so it skips this file since we overwrote it,
    # leaving nginx IPv4-only while musl's /etc/hosts resolves "localhost"
    # to ::1 first (connection refused). api/ingest don't need this because
    # Go's net.Listen(":PORT") binds dual-stack by default.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path that isn't a real static file falls back to index.html
    # so React Router's client-side routes (e.g. /settings/webhooks) work on
    # a hard refresh, not just on in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references content-hashed JS/CSS filenames (e.g.
    # index-Bre9tenQ.js) that change on every build -- without this, a
    # browser can hold onto a stale index.html across a local redeploy
    # (`task deploy:up` after a code change) and request an asset filename
    # that no longer exists in the freshly built image, breaking the app
    # with no obvious error. The hashed assets themselves are safe to cache
    # forever since a change always gets a new filename.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SSE (see EventsHandlers.Stream): nginx buffers proxied responses by
    # default, which would hold every event in a buffer until it filled or
    # the connection closed instead of forwarding them as they arrive --
    # defeating the whole point of a live stream. Exact-match location so
    # only this one endpoint pays for unbuffered/long-lived proxying, not
    # every other /api/ response.
    location = /api/v1/events/stream {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Same two path prefixes vite.config.ts proxies in dev -- "api" here is
    # the Docker Compose service name, resolved via the compose network's
    # internal DNS, not localhost.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
