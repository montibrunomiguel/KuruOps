server {
    # 8080, not 80: nginxinc/nginx-unprivileged (see frontend/Dockerfile)
    # runs as a non-root user, which can't bind a port below 1024.
    listen 8080;
    # Without this, "wget http://localhost:8080/" inside the container fails
    # -- nginx's own IPv6-listen-enable script only patches the *unmodified*
    # packaged default.conf, so it skips this file since we overwrote it,
    # leaving nginx IPv4-only while musl's /etc/hosts resolves "localhost"
    # to ::1 first (connection refused). api/ingest don't need this because
    # Go's net.Listen(":PORT") binds dual-stack by default.
    listen [::]:8080;
    server_name _;

    # nginx's own default (1MB) is far below the 25MB attachments are
    # allowed to be (see backend/internal/httpserver/handlers/uploads.go's
    # defaultMaxUploadBytes) -- without this, any attachment over ~1MB was
    # rejected here with a raw 413 "Request Entity Too Large" before the
    # multipart body ever reached the Go backend's own (JSON-error, much
    # friendlier) size check. 30m leaves headroom over the 25MB file cap for
    # multipart framing overhead (boundary markers, the kind/id form fields).
    client_max_body_size 30m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path that isn't a real static file falls back to index.html
    # so React Router's client-side routes (e.g. /settings/webhooks) work on
    # a hard refresh, not just on in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references content-hashed JS/CSS filenames (e.g.
    # index-Bre9tenQ.js) that change on every build -- without this, a
    # browser can hold onto a stale index.html across a local redeploy
    # (`task deploy:up` after a code change) and request an asset filename
    # that no longer exists in the freshly built image, breaking the app
    # with no obvious error. The hashed assets themselves are safe to cache
    # forever since a change always gets a new filename.
    # Security headers belong here, not at the server level: try_files'
    # fallback to /index.html re-triggers nginx's location matching, so this
    # exact-match block is hit both for a direct request and for every SPA
    # route falling back to it -- the only place an actual HTML document is
    # served from this container. /api/ and /auth/ below are pure proxies to
    # the Go api container, which sets its own (much stricter, JSON-API-
    # appropriate) security headers -- see middleware.SecurityHeaders; adding
    # add_header here at the server level would double up on those proxied
    # responses instead of leaving each layer responsible for its own.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        # unsafe-inline on style-src is required, not a leftover: the React
        # tree uses inline `style={{...}}` extensively (charts especially),
        # which CSP treats the same as a literal style="..." attribute --
        # there is no dangerouslySetInnerHTML/inline <script> anywhere in
        # this app, so script-src stays strict with no matching exception.
        # img-src includes blob: -- attachment thumbnails (Team Notes,
        # close-comment evidence) are fetched with the app's own auth token
        # and rendered via URL.createObjectURL (see AttachmentButton.tsx's
        # useAttachmentBlob) rather than a plain <img src> pointed straight
        # at the backend, since /api/v1/uploads/images/* requires
        # Authorization like every other /api/v1 route and a plain <img>
        # request can't carry one.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Re-resolve the api upstream instead of pinning it at startup.
    #
    # "proxy_pass http://api:8080" with a literal hostname is resolved ONCE,
    # when nginx loads its config, and cached for the life of the process.
    # Container IPs are not stable: restart the api (a deploy, a crash, a
    # scale event) and it comes back on a new address while nginx keeps
    # dialling the old one -- every API call 502s, nothing recovers on its
    # own, and the only fix is restarting the frontend too. Observed
    # directly: nginx connecting to 172.20.0.6 while the api sat healthy on
    # 172.20.0.5.
    #
    # Naming the upstream through a variable forces nginx to resolve it per
    # request instead, using this resolver. 127.0.0.11 is Docker's embedded
    # DNS; point it at the cluster resolver for another runtime. ipv6=off
    # because the embedded resolver answers AAAA for names with no IPv6
    # address and nginx would try that empty result first.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "http://api:8080";

    # SSE (see EventsHandlers.Stream): nginx buffers proxied responses by
    # default, which would hold every event in a buffer until it filled or
    # the connection closed instead of forwarding them as they arrive --
    # defeating the whole point of a live stream. Exact-match location so
    # only this one endpoint pays for unbuffered/long-lived proxying, not
    # every other /api/ response.
    location = /api/v1/events/stream {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Same two path prefixes vite.config.ts proxies in dev -- "api" here is
    # the Docker Compose service name, resolved via the compose network's
    # internal DNS, not localhost.
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
