name: kuruops

# mem_limit/cpus below are conservative defaults sized for running the whole
# stack on a single laptop, not a production sizing recommendation -- raise
# them (or drop them entirely) for a real deployment based on actual
# observed usage (see the new kuruops_db_pool_* /
# kuruops_http_request_duration_seconds metrics on /metrics). Without any
# limit, a single runaway container (e.g. a stuck query, a memory leak) can
# starve every other service on the same host.
services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    cpus: 1.0
    # Overriding these (see .env.example) also requires updating every
    # `docker compose exec postgres psql -U postgres ...` / `pg_dump -U
    # postgres` call in Taskfile.yml (task db:up/db:test:up/db:backup/etc.)
    # and the migrate service's connection string above -- this compose
    # file's own migrate service already reads the same vars, Taskfile.yml's
    # dev-tooling commands do not.
    environment:
      POSTGRES_DB: kuruops
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kuruops"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Real HashiCorp Vault in dev mode (in-memory storage, auto-unsealed, a KV
  # v2 engine already mounted at secret/) -- backs internal/secrets.VaultStore's
  # own integration test (see Taskfile.yml's backend:test:vault). Root token
  # is fixed and public on purpose: this is throwaway dev-mode Vault, never
  # start it this way outside a laptop. No volume: in-memory, gone on stop.
  vault-dev:
    image: hashicorp/vault:latest
    profiles: ["tools"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8200/v1/sys/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  # A second, standalone Postgres instance standing in for a customer's
  # external database -- only internal/dbmigrate's own integration test
  # points at this (see Taskfile.yml's backend:test:migration), never
  # started by plain `docker compose up`. No volume: entirely disposable,
  # the test resets it on every run -- overriding POSTGRES_TARGET_USER/
  # PASSWORD below also requires updating Taskfile.yml's own hardcoded
  # TEST_MIGRATION_TARGET_USER/PASSWORD (kept separately hardcoded there
  # since this container is ephemeral test infra, not a credential anyone
  # actually needs to rotate in practice).
  postgres-target:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      POSTGRES_DB: kuruops_target
      POSTGRES_USER: ${POSTGRES_TARGET_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_TARGET_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kuruops_target"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off migration runner: `docker compose run --rm migrate up` (or
  # `task db:migrate`). Not started by `docker compose up` (profiles: tools).
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      [
        "migrate",
        "-path=/migrations",
        "-database=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/kuruops?sslmode=disable",
      ]

  api:
    build:
      # Repo root, not ./backend -- see backend/Dockerfile's top comment
      # (the api image also bakes in db/migrations for the external-DB
      # migration feature).
      context: .
      dockerfile: backend/Dockerfile
      target: api
    mem_limit: 256m
    cpus: 1.0
    environment:
      # kuruops_app has no table ownership / BYPASSRLS -- see
      # db/init/kuruops_app_role.sql and db/README.md for why that's the
      # whole point of row-level security actually applying.
      DATABASE_URL: postgres://kuruops_app:${KURUOPS_APP_PASSWORD:-kuruops_app}@postgres:5432/kuruops?sslmode=disable
      HTTP_ADDR: :8080
      # AUTH_MODE=dev generates a JWT keypair (persisted under DEV_KEYS_DIR,
      # see the dev-jwt-keys volume below) instead of requiring
      # JWT_PRIVATE_KEY_PATH/JWT_PUBLIC_KEY_PATH for a one-command local
      # deploy, but auth is still real -- login still issues a token that's
      # actually verified (see backend/cmd/api/main.go). Never do this
      # outside local dev -- switch to jwt + mount real keys for anything
      # resembling production.
      AUTH_MODE: ${AUTH_MODE:-dev}
      DEV_KEYS_DIR: /app/.dev-keys
      UPLOAD_DIR: /data/uploads
      # Encrypts secrets.PersistentEnvStore's rows in Postgres (secret_store
      # table) -- the default dev value below is fine for local Docker
      # Compose, never reuse it for anything resembling production (generate
      # your own with `openssl rand -base64 32` and set it in the
      # environment instead).
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-k83Yh5rQGCdVDMbUtJywr5J6ScE6++Bp4m936YZDecw=}
      # Per-account login rate limit -- see middleware.NewRateLimiter's
      # caller in cmd/api/main.go. Empty OTEL endpoint keeps tracing fully
      # inert (see internal/telemetry.Setup's doc comment).
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-20}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # httpguard refuses to dial any admin-configured outbound URL (an
      # escalation webhook destination, an MCP endpoint, an OpenAI-compatible
      # base_url) that resolves to a loopback/link-local/private address, to
      # close an SSRF pivot from "can edit Settings" to "can reach the
      # internal network". A genuine on-prem deployment whose destinations
      # ARE private sets this to "true". It has to be declared here to have
      # any effect: compose reads .env only for ${...} substitution, so a
      # value sitting in .env that no service references never reaches a
      # container. See docs/THREAT_MODEL.md.
      ALLOW_PRIVATE_NETWORK_TARGETS: ${ALLOW_PRIVATE_NETWORK_TARGETS:-}
      # Settings -> Storage Integration -> Google Drive's "Connect your
      # Google account" OAuth path -- both empty (the default) disables it
      # entirely, leaving the service-account alternative unaffected. See
      # config.Config.GoogleOAuthClientID's doc comment.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Settings -> Conectores -> Slack's "Conectar ao Slack" OAuth path --
      # empty disables it. See docs/SLACK_APP_SETUP.md for how to obtain
      # these from a Slack App. SLACK_SIGNING_SECRET is unused until a
      # future release adds an inbound Slack Events receiver, but is
      # collected now since the Slack App fixes it at creation time
      # regardless.
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    volumes:
      - uploads:/data/uploads
      # Survives `docker compose restart`/`down` (without -v) so the
      # AUTH_MODE=dev keypair generated on first boot doesn't get thrown
      # away and regenerated -- see DEV_KEYS_DIR above and
      # cmd/api/main.go's loadOrGenerateJWTKeys. A `docker compose down -v`
      # wipes it same as the Postgres data volume, which is fine: it's
      # local dev convenience, not anything that needs to survive that.
      - dev-jwt-keys:/app/.dev-keys
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # wget is BusyBox, already in the alpine base image -- no curl install
    # needed just for this. Lets `docker compose up --wait` (see Taskfile.yml)
    # block until the API is actually answering instead of a hand-rolled
    # polling loop, which turned out to need host tools (sleep, seq) that
    # don't exist on a bare Windows PATH.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  ingest:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ingest
    mem_limit: 256m
    cpus: 1.0
    environment:
      DATABASE_URL: postgres://kuruops_app:${KURUOPS_APP_PASSWORD:-kuruops_app}@postgres:5432/kuruops?sslmode=disable
      HTTP_ADDR: :8081
      # ingest has no JWT auth surface of its own (webhook ingest is
      # authenticated by a per-endpoint token, not a login session) -- this
      # only matters here as the same dev/production signal
      # secrets.NewFromConfig checks before allowing the default
      # SECRETS_ENCRYPTION_KEY below. See the api service's own comment.
      AUTH_MODE: ${AUTH_MODE:-dev}
      # Must match the api service's key -- both resolve refs written by
      # either service (webhook/AI-analysis secrets can be set from either
      # side). See the api service's own comment above.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-k83Yh5rQGCdVDMbUtJywr5J6ScE6++Bp4m936YZDecw=}
      # Keyed on the SOURCE IP, not the endpoint or the token: every source
      # arriving from one address shares this budget. That is the right
      # shape for a flood defence, but it means a customer whose SIEM
      # forwarder or NAT fronts several integrations gets ONE budget for the
      # whole SOC -- at the old default of 60 a five-source setup started
      # returning 429 at 12 alerts per source per minute. Raised to a
      # figure a real alert volume fits inside while still bounding a
      # flood; lower it if your ingest sits on an untrusted network.
      WEBHOOK_RATE_LIMIT_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_PER_MINUTE:-600}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # httpguard refuses to dial any admin-configured outbound URL (an
      # escalation webhook destination, an MCP endpoint, an OpenAI-compatible
      # base_url) that resolves to a loopback/link-local/private address, to
      # close an SSRF pivot from "can edit Settings" to "can reach the
      # internal network". A genuine on-prem deployment whose destinations
      # ARE private sets this to "true". It has to be declared here to have
      # any effect: compose reads .env only for ${...} substitution, so a
      # value sitting in .env that no service references never reaches a
      # container. See docs/THREAT_MODEL.md.
      ALLOW_PRIVATE_NETWORK_TARGETS: ${ALLOW_PRIVATE_NETWORK_TARGETS:-}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/healthz"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    mem_limit: 256m
    cpus: 0.5
    environment:
      # kuruops_worker (not kuruops_app) -- it owns and refreshes
      # mv_alert_daily_stats/mv_incident_kpis, which needs BYPASSRLS to see
      # across all tenants. See db/init/kuruops_worker_role.sql.
      DATABASE_URL: postgres://kuruops_worker:${KURUOPS_WORKER_PASSWORD:-kuruops_worker}@postgres:5432/kuruops?sslmode=disable
      HTTP_ADDR: :8082
      # worker has no HTTP auth surface at all -- this only matters here as
      # the same dev/production signal secrets.NewFromConfig checks before
      # allowing the default SECRETS_ENCRYPTION_KEY below. See the api
      # service's own comment.
      AUTH_MODE: ${AUTH_MODE:-dev}
      # Must match the api service's key -- see its comment above.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-k83Yh5rQGCdVDMbUtJywr5J6ScE6++Bp4m936YZDecw=}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # httpguard refuses to dial any admin-configured outbound URL (an
      # escalation webhook destination, an MCP endpoint, an OpenAI-compatible
      # base_url) that resolves to a loopback/link-local/private address, to
      # close an SSRF pivot from "can edit Settings" to "can reach the
      # internal network". A genuine on-prem deployment whose destinations
      # ARE private sets this to "true". It has to be declared here to have
      # any effect: compose reads .env only for ${...} substitution, so a
      # value sitting in .env that no service references never reaches a
      # container. See docs/THREAT_MODEL.md.
      ALLOW_PRIVATE_NETWORK_TARGETS: ${ALLOW_PRIVATE_NETWORK_TARGETS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/healthz"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  pgdata:
  uploads:
  dev-jwt-keys:
