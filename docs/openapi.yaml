      description: >
        Returns 400 if this deployment has no Google OAuth client configured
        (GOOGLE_OAUTH_CLIENT_ID/SECRET unset) -- the service-account path
        above is unaffected either way. The returned url carries a
        single-use CSRF state token; the frontend redirects the browser to
        it directly (window.location.href), it is not fetched via XHR.
      parameters:
