  # ----------------------------------------------------------- Settings: Users
  /api/v1/settings/users:
    get:
      tags: [Settings - Users]
      summary: List all users (admin view)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Settings - Users]
      summary: Create a local user
      description: Response includes a one-time temporaryPassword the admin must relay to the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                name: { type: string }
                role: { $ref: '#/components/schemas/UserRole' }
                resourceAccess: { $ref: '#/components/schemas/ResourceAccess' }
                allowedTags:
                  type: array
                  items: { type: string }
              required: [email, name, role]
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  temporaryPassword: { type: string }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/users/{id}/access:
    put:
      tags: [Settings - Users]
      summary: Update a user's role, resourceAccess, and allowedTags
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
                resourceAccess: { $ref: '#/components/schemas/ResourceAccess' }
                allowedTags:
                  type: array
                  items: { type: string }
      responses:
        "204":
          description: Access updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/users/{id}/deactivate:
    post:
      tags: [Settings - Users]
      summary: Deactivate a user
      description: Also best-effort revokes the user's active refresh tokens.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "204":
          description: Deactivated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/users/{id}/activate:
    post:
      tags: [Settings - Users]
      summary: Reactivate a user
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "204":
          description: Activated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/users/{id}/reset-password:
    post:
      tags: [Settings - Users]
      summary: Reset a user's password
      description: Response includes a one-time temporaryPassword, same show-once convention as user creation.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  temporaryPassword: { type: string }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/users/{id}/revoke-sessions:
    post:
      tags: [Settings - Users]
      summary: Revoke a user's active refresh tokens
      description: Does not deactivate the account; the current access token still works until its own 15-minute expiry.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "204":
          description: Sessions revoked
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/settings/users/group-mappings:
    get:
      tags: [Settings - Users]
      summary: List LDAP/SAML group-to-role mappings
      responses:
        "200":
          description: Group mappings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthGroupMapping' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/settings/users/group-mappings/{provider}/{group}:
    put:
      tags: [Settings - Users]
      summary: Create or update a group-to-role mapping
      description: Applied just-in-time on every federated login, so IdP group membership changes take effect without manual user edits.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/AuthProvider' }
        - name: group
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
                resourceAccess: { $ref: '#/components/schemas/ResourceAccess' }
                allowedTags:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Mapping saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthGroupMapping' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/users/group-mappings/{id}:
    delete:
      tags: [Settings - Users]
      summary: Delete a group-to-role mapping
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Mapping deleted
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

