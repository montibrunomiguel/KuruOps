  # ------------------------------------------------- Settings: Audit Export
  # ------------------------------------------------------ Settings: Audit Log
  /api/v1/settings/audit-log:
    get:
      tags: [Settings - Audit Log]
      summary: List Settings changes, newest first
      description: >
        Keyset-paginated: beforeCreatedAt/beforeId (both from a previous
        page's nextCursor) resume the listing; omit both for the first
        page. Every one of the ~15 Settings areas (Webhooks, Field Mapping
        Templates, AI Integration, MCP Servers, Users, Roles, Identity
        Providers, Tags, Storage Integration, SMTP, Slack, On-Call Schedule,
        Incident SLAs, Escalation Chain, Retention) writes its own events
        here.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: beforeCreatedAt
          in: query
          description: RFC3339Nano cursor timestamp from a previous page's nextCursor.createdAt. Requires beforeId.
          schema: { type: string, format: date-time }
        - name: beforeId
          in: query
          description: Cursor event id from a previous page's nextCursor.id. Requires beforeCreatedAt.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: One page of Settings-change events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditLogPage'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/settings/audit-export/cef:
    get:
      tags: [Settings - Audit Export]
      summary: Export the tenant's alert/incident event history as CEF
      description: >
        Downloadable text/plain CEF log. Supports keyset pagination:
        sinceCreatedAt/sinceEventId resume a previous pull; when more pages
        remain, the response carries X-Next-Cursor-Created-At and
        X-Next-Cursor-Event-Id headers for the next call.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 1000, maximum: 10000 }
        - name: sinceCreatedAt
          in: query
          description: RFC3339Nano cursor timestamp from a previous page's X-Next-Cursor-Created-At header.
          schema: { type: string, format: date-time }
        - name: sinceEventId
          in: query
          description: Cursor event id from a previous page's X-Next-Cursor-Event-Id header.
          schema: { type: string }
      responses:
        "200":
          description: CEF log lines
          headers:
            X-Next-Cursor-Created-At:
              description: Present only if more pages remain.
              schema: { type: string }
            X-Next-Cursor-Event-Id:
              description: Present only if more pages remain.
              schema: { type: string }
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/settings/audit-export/json:
    get:
      tags: [Settings - Audit Export]
      summary: Export the tenant's alert/incident event history as newline-delimited JSON
      description: >
        Downloadable application/x-ndjson (one domain.AuditEvent JSON object
        per line). Same keyset-pagination cursor mechanics as the CEF
        export above -- sinceCreatedAt/sinceEventId resume a previous pull,
        X-Next-Cursor-* response headers carry the next page's cursor.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 1000, maximum: 10000 }
        - name: sinceCreatedAt
          in: query
          description: RFC3339Nano cursor timestamp from a previous page's X-Next-Cursor-Created-At header.
          schema: { type: string, format: date-time }
        - name: sinceEventId
          in: query
          description: Cursor event id from a previous page's X-Next-Cursor-Event-Id header.
          schema: { type: string }
      responses:
        "200":
          description: Newline-delimited JSON audit events
          headers:
            X-Next-Cursor-Created-At:
              description: Present only if more pages remain.
              schema: { type: string }
            X-Next-Cursor-Event-Id:
              description: Present only if more pages remain.
              schema: { type: string }
          content:
            application/x-ndjson:
              schema:
                type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------- Settings: Retention
  /api/v1/settings/retention:
    get:
      tags: [Settings - Retention]
      summary: Get the tenant's data retention policy
      description: >
        Unlike most Settings GETs, this never returns null: retention is on
        by default (18 months per resource type), so an unconfigured tenant
        still gets real numbers back, with configured=false marking them as
        the synthesized default rather than an explicit save.
      responses:
        "200":
          description: Retention config -- always non-null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionConfig'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Settings - Retention]
      summary: Set the tenant's data retention policy
      description: >
        Lowering either value below an existing closed alert/incident's age
        causes it to be permanently deleted on the next hourly sweep --
        evidence in blob storage is never touched, only the tool's own
        record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alertRetentionMonths: { type: integer, minimum: 0 }
                incidentRetentionMonths: { type: integer, minimum: 0 }
              required: [alertRetentionMonths, incidentRetentionMonths]
      responses:
        "204":
          description: Saved
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  # ----------------------------------------------------------- Settings: Slack
  /api/v1/settings/integrations/slack:
    get:
      tags: [Settings - Slack]
      summary: Get the tenant's connected Slack workspace
      responses:
        "200":
          description: Slack config, or null if no workspace is connected
          content:
            application/json:
              schema:
                type: object
                nullable: true
                allOf: [{ $ref: '#/components/schemas/SlackConfig' }]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Settings - Slack]
      summary: Disconnect the tenant's Slack workspace
      responses:
        "204":
          description: Disconnected
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/settings/integrations/slack/oauth/authorize-url:
    get:
      tags: [Settings - Slack]
      summary: Get the Slack consent-screen URL to connect a workspace
      description: >
        Returns 400 if this deployment has no Slack App configured
        (SLACK_CLIENT_ID/SECRET unset -- see docs/SLACK_APP_SETUP.md). The
        returned url carries a single-use CSRF state token; the frontend
        redirects the browser to it directly (window.location.href), it is
        not fetched via XHR.
      responses:
        "200":
          description: Authorize URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  # -------------------------------------------- Settings: Database Migration
  /api/v1/settings/database-migration/test-connection:
    post:
      tags: [Settings - Database Migration]
      summary: Test connectivity to a target external database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetDBConfig'
      responses:
        "204":
          description: Connection succeeded
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/database-migration/migrate:
    post:
      tags: [Settings - Database Migration]
      summary: One-time cutover to an externally hosted database
      description: >
        Synchronous: tests the connection, replays schema migrations, sets
        up app/worker roles, and copies every row over in one blocking call
        (seconds to minutes depending on data volume). The returned DSNs must
        be put in DATABASE_URL for api/ingest and worker before restarting
        the stack against the new database -- this is a manual-restart
        cutover, not a live hot-swap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetDBConfig'
      responses:
        "200":
          description: Migration complete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationResult' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Required on every /api/v1/** route. /auth/** is intentionally
        unauthenticated (that's how a session is obtained in the first
        place), and /healthz and /metrics are unauthenticated for
        infrastructure health checks and scraping. A caller whose
        mustChangePassword flag is still set can reach nothing under
        /api/v1/** except POST /api/v1/account/change-password (see
        RequirePasswordChanged), receiving 403 on everything else until the
        password is changed.

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size, 1-200. Invalid or out-of-range values fall back to the server default (50).
      schema: { type: integer, minimum: 1, maximum: 200 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0 }
    AlertId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncidentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlaybookId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LLMProviderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MCPServerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ToolCallId:
      name: callId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OnCallScheduleId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OnCallOverrideId:
      name: overrideId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request body, path, or query parameter
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The request is well-formed, but conflicts with the resource's current state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, malformed, or expired bearer token
      content:
        text/plain:
          schema:
            type: string
            description: >-
              Plain-text error message, issued by the auth middleware via
              http.Error -- not the handler-level JSON error shape used
              elsewhere in this API.
    Forbidden:
      description: Authenticated, but the caller's role/resourceAccess doesn't permit this action (or the account still must change its password)
      content:
        text/plain:
          schema:
            type: string
            description: >-
              Plain-text error message, issued by the auth middleware via
              http.Error -- not the handler-level JSON error shape used
              elsewhere in this API.
    NotFound:
      description: No resource with that id (or not visible under the caller's tag scope)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected server-side failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: Standard handler-level error shape, written by handlers.writeError.
      properties:
        error:
          type: string
      required: [error]

    BulkResult:
      type: object
      description: >-
        The outcome of one item within a bulk operation -- a partial failure
        (e.g. one of the selected ids is no longer visible to the caller)
        doesn't fail the whole request, so each id's outcome is reported
        independently here.
      properties:
        id: { type: string, format: uuid }
        success: { type: boolean }
        error: { type: string }
      required: [id, success]
    BulkResponse:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/BulkResult' }
      required: [results]

    Severity:
      type: string
      enum: [critical, high, medium, low, informational]
    AlertStatus:
      type: string
      enum: [open, investigating, escalated, closed]
    Classification:
      type: string
      enum: [false_positive, true_positive, authorized_event]
    IncidentPhase:
      type: string
      enum: [new, detection_analysis, containment, eradication, recovery, post_incident]
    IncidentPriority:
      type: string
      enum: [p1, p2, p3, p4]
    IncidentRole:
      type: string
      enum: [commander, technical_lead, incident_handler, communications_lead, privacy_officer]
    AuthProvider:
      type: string
      enum: [local, ldap, saml]
    ActorType:
      type: string
      enum: [user, system, ai]
    ToolCallStatus:
      type: string
      enum: [proposed, approved, rejected, executed, failed]
    EscalationChannelType:
      type: string
      enum: [pagerduty, slack, webhook]
    ResourceAccess:
      type: array
      description: Capability set; any combination of the three values.
      items:
        type: string
        enum: [alerts, incidents, followup]

    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    User:
      type: object
      description: >-
        PasswordHash/MFATOTPSecret are never serialized (json:"-" in the Go
        struct). Access (isAdmin/resourceAccess/allowedTags) is not carried
        directly on a User -- it's entirely delegated to the assigned Role,
        via roleId.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        authProvider: { $ref: '#/components/schemas/AuthProvider' }
        externalId: { type: string, nullable: true }
        roleId: { type: string, format: uuid }
        role: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/Role' }] }
        phone:
          type: string
          nullable: true
          description: E.164-ish, country code required -- surfaced in Escalation Chain webhook payloads as {{analystPhone}}.
        isActive: { type: boolean }
        mustChangePassword: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, tenantId, email, name, authProvider, roleId, role, isActive, mustChangePassword, createdAt, updatedAt]

    AuthGroupMapping:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/AuthProvider' }
        externalGroup: { type: string }
        roleId: { type: string, format: uuid }
        role: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/Role' }] }
        createdAt: { type: string, format: date-time }

    Role:
      type: object
      description: >-
        A named, reusable access bundle -- users and IdP group mappings are
        assigned to one via roleId, rather than carrying
        isAdmin/resourceAccess/allowedTags individually.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        isAdmin: { type: boolean }
        resourceAccess: { $ref: '#/components/schemas/ResourceAccess' }
        allowedTags:
          type: array
          items: { type: string }
          description: Empty = unrestricted, sees all tags.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, tenantId, name, isAdmin, resourceAccess, allowedTags, createdAt, updatedAt]

    SaveRoleRequest:
      type: object
      properties:
        name: { type: string }
        isAdmin: { type: boolean }
        resourceAccess: { $ref: '#/components/schemas/ResourceAccess' }
        allowedTags:
          type: array
          items: { type: string }
      required: [name, isAdmin, resourceAccess, allowedTags]

    APIToken:
      type: object
      description: A personal API token's metadata -- TokenHash is never serialized, and the plaintext value is returned only once, from the create-token response.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        tokenLast4: { type: string }
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Null for a token the user explicitly opted out of expiring.
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
      required: [id, tenantId, userId, name, tokenLast4, createdAt]

    LoginRequest:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
      required: [email, password]

    # No refreshToken field: it is delivered as the HttpOnly `kuruops_refresh`
    # cookie instead, so that page scripts have no way to read it. Applies to
    # every login path -- local, LDAP, MFA's second step, and SAML's ACS.
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            name: { type: string }
            role: { type: string }
            mustChangePassword: { type: boolean }

    MfaRequiredResponse:
      type: object
      description: >-
        What POST /auth/login returns instead of LoginResponse when the
        account has TOTP enrolled -- the password was correct, but no
        session exists yet. Present pendingToken alongside a 6-digit code to
        POST /auth/mfa/verify (which returns a normal LoginResponse) to
        complete the login.
      properties:
        mfaRequired: { type: boolean, enum: [true] }
        pendingToken: { type: string }
      required: [mfaRequired, pendingToken]

    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        externalId: { type: string, nullable: true }
        webhookEndpointId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        source: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        originalSeverity: { $ref: '#/components/schemas/Severity' }
        status: { $ref: '#/components/schemas/AlertStatus' }
        classification:
          type: string
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Classification' }]
        closeComment: { type: string, nullable: true }
        closeImageUrl: { type: string, nullable: true }
        ruleId: { type: string, nullable: true }
        asset: { type: string, nullable: true }
        srcIp: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        payload:
          description: Unfiltered raw webhook body -- arbitrary JSON.
        metadata:
          description: Sender's curated key/value list; always an object, possibly empty, never null.
          type: object
        incidentId: { type: string, format: uuid, nullable: true }
        assignedAnalystId: { type: string, format: uuid, nullable: true }
        assignedAnalystName: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        latestAnalysis:
          type: string
          nullable: true
          description: Most recent completed "Analyze with AI" result text -- only set once latestAnalysisStatus is "completed". Only populated on GET of a single alert, not on list.
        latestAnalysisStatus:
          type: string
          nullable: true
          enum: [running, paused, completed, failed]
          description: Null if no analysis has ever been requested for this alert.
        latestAnalysisError:
          type: string
          nullable: true
          description: Set only when latestAnalysisStatus is "failed".
      required: [id, tenantId, title, source, severity, originalSeverity, status, tags, payload, metadata, receivedAt, createdAt, updatedAt]

    AlertComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        alertId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        body: { type: string }
        imageUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Incident:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        priority: { $ref: '#/components/schemas/IncidentPriority' }
        phase: { $ref: '#/components/schemas/IncidentPhase' }
        assignees:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        roles:
          type: array
          description: Only populated on GET of a single incident, not on list.
          items: { $ref: '#/components/schemas/IncidentRoleAssignment' }
        tags:
          type: array
          items: { type: string }
        slaDueAt: { type: string, format: date-time, nullable: true }
        slaBreached: { type: boolean }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        latestAnalysis:
          type: string
          nullable: true
          description: Most recent completed "Analyze with AI" result text -- only set once latestAnalysisStatus is "completed".
        latestAnalysisStatus:
          type: string
          nullable: true
          enum: [running, paused, completed, failed]
          description: Null if no analysis has ever been requested for this incident.
        latestAnalysisError:
          type: string
          nullable: true
          description: Set only when latestAnalysisStatus is "failed".
      required: [id, tenantId, title, description, severity, priority, phase, assignees, roles, tags, slaBreached, openedAt, createdAt, updatedAt]

    IncidentRoleAssignment:
      type: object
      properties:
        role: { $ref: '#/components/schemas/IncidentRole' }
        user: { $ref: '#/components/schemas/UserSummary' }

    IncidentStatusHistoryEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        phase: { $ref: '#/components/schemas/IncidentPhase' }
        enteredAt: { type: string, format: date-time }
        correctedEnteredAt: { type: string, format: date-time, nullable: true }
        correctedAt: { type: string, format: date-time, nullable: true }
        correctedBy: { type: string, format: uuid, nullable: true }
        correctionReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    IncidentEvent:
      type: object
      description: Append-only audit row; never updated after insert.
      properties:
        id: { type: integer, format: int64 }
        incidentId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        eventType:
          type: string
          enum: [created, phase_changed, phase_skipped, closed, severity_priority_changed, description_edited, tags_changed, alert_linked, alert_unlinked, ai_analysis_run, status_timestamp_corrected, assignees_changed, role_assigned, role_unassigned]
        actorType: { $ref: '#/components/schemas/ActorType' }
        actorId: { type: string, format: uuid, nullable: true }
        data:
          description: Event-type-specific JSON payload.
        createdAt: { type: string, format: date-time }

    IncidentComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        body: { type: string }
        imageUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    IOCType:
      type: string
      description: >-
        See backend domain.IOCType's doc comment for the NIST SP 800-61r3 /
        SP 800-150 / STIX 2.1 sourcing of this list.
      enum:
        - ip_address
        - domain_name
        - url
        - file_hash
        - email_address
        - email_subject
        - file_name
        - file_path
        - registry_key
        - mutex
        - process_name
        - user_agent
        - cve
        - certificate_fingerprint
        - other

    IOC:
      type: object
      description: >-
        An Indicator of Compromise recorded against an incident --
        scoped to exactly one incident, append-only (no update/delete
        route). Pulled automatically into both the Markdown postmortem and
        the PDF report.
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/IOCType' }
        value: { type: string }
        description: { type: string }
        identifiedAt:
          type: string
          format: date-time
          description: When the analyst determined this indicator was associated with the incident -- distinct from createdAt.
        createdBy: { type: string, format: uuid }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, incidentId, tenantId, type, value, description, identifiedAt, createdBy, createdByName, createdAt]

    Playbook:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        keywords:
          type: array
          items: { type: string }
        steps:
          type: object
          description: Map of NIST phase -> ordered action lines for that phase.
          additionalProperties:
            type: array
            items: { type: string }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SavePlaybookRequest:
      type: object
      properties:
        title: { type: string }
        category: { type: string }
        description: { type: string }
        keywords:
          type: array
          items: { type: string }
        steps:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
      required: [title]

    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    WebhookEndpoint:
      type: object
      description: TokenHash is never serialized; only the last 4 characters are exposed.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        source: { type: string }
        tokenLast4: { type: string }
        status: { type: string }
        rotatedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        fieldMappingTemplateId:
          type: string
          format: uuid
          nullable: true
          description: Set via PUT /{id}/field-mapping-template.
        groupByFields:
          type: array
          items: { type: string }
          description: JSON-path list; empty means dedup is off for this endpoint. Set via PUT /{id}/group-by-fields.
        dedupWindowMinutes:
          type: integer
          description: Only meaningful when groupByFields is non-empty; defaults to 30.

    FieldMappingRule:
      type: object
      properties:
        jsonPath:
          type: string
          description: Dot notation into the sender's raw payload, e.g. host.name.
        label:
          type: string
          description: Key this value is merged into the alert's metadata object under -- skipped if that key already came from the automatic top-level "metadata" extraction.
      required: [jsonPath, label]

    FieldMappingTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        rules:
          type: array
          items: { $ref: '#/components/schemas/FieldMappingRule' }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, tenantId, name, rules, createdAt, updatedAt]

    LLMProvider:
      type: object
      description: APIKeySecretRef is never serialized; the key itself is never stored in this table.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        baseUrl: { type: string, nullable: true }
        model: { type: string }
        isDefault: { type: boolean }
        autoAnalyzeAllAlerts:
          type: boolean
          description: >
            When true and this is the tenant's default provider, every alert
            ingested via webhook is analyzed automatically. Off by default:
            analysis then only happens when an analyst clicks "Analyze with AI".
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SaveLLMProviderRequest:
      type: object
      properties:
        name: { type: string }
        kind: { type: string }
        baseUrl: { type: string, nullable: true }
        model: { type: string }
        apiKey:
          type: string
          description: Write-only. Required on create; empty on update means "keep the existing key".
        autoAnalyzeAllAlerts:
          type: boolean
          description: Fully replaces the stored value on every save, unlike apiKey -- there's no "omit to keep existing" case.
      required: [name, model]

    MCPServer:
      type: object
      description: AuthSecretRef is never serialized.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        transport: { type: string }
        endpointOrCommand: { type: string }
        allowedTools:
          type: array
          items: { type: string }
        enabledFor:
          type: array
          items: { type: string }
        sideEffectingTools:
          type: array
          items: { type: string }
          description: Subset of allowedTools that always require analyst approval before executing.
        isEnabled: { type: boolean }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SaveMCPServerRequest:
      type: object
      properties:
        name: { type: string }
        transport: { type: string }
        endpointOrCommand: { type: string }
        authToken:
          type: string
          description: Write-only.
        allowedTools:
          type: array
          items: { type: string }
        enabledFor:
          type: array
          items: { type: string }
        sideEffectingTools:
          type: array
          items: { type: string }
      required: [name, endpointOrCommand]

    MCPTool:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        inputSchema:
          description: JSON Schema describing the tool's arguments.

    AIToolCall:
      type: object
      description: Forensic log row of an MCP tool the analysis agent invoked or proposed.
      properties:
        id: { type: integer, format: int64 }
        tenantId: { type: string, format: uuid }
        mcpServerId: { type: string, format: uuid }
        toolName: { type: string }
        contextType:
          type: string
          enum: [alert, incident]
        contextId: { type: string, format: uuid }
        args:
          description: Arguments the agent proposed calling the tool with.
        result:
          description: Tool result, once executed.
        status: { $ref: '#/components/schemas/ToolCallStatus' }
        approvedBy: { type: string, format: uuid, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ChatToolCall:
      type: object
      description: A tool call as it appears inline in a ChatMessage -- the live-run counterpart of AIToolCall's forensic log row.
      properties:
        id: { type: string, description: "The AIToolCall's id, as a string." }
        name: { type: string }
        args:
          description: Arguments the agent proposed calling the tool with.

    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant, tool]
        content: { type: string }
        toolCalls:
          type: array
          items: { $ref: '#/components/schemas/ChatToolCall' }
        toolCallId:
          type: string
          description: Present on a "tool" role message -- which ChatToolCall this is the result of.
      required: [role, content]

    ChatTranscript:
      type: object
      description: >-
        GET .../analyze/messages' response -- the run's full conversation
        (minus the auto-generated seed prompt) plus enough status to drive
        the chat UI.
      properties:
        runId: { type: integer, format: int64 }
        status:
          type: string
          enum: [running, paused, completed, failed]
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        pendingToolCallId:
          type: integer
          format: int64
          nullable: true
          description: Set (status "paused") when a proposed tool call is awaiting approve/reject via the .../tool-calls/{callId} endpoints.
        error:
          type: string
          nullable: true
      required: [messages]

    LDAPConfig:
      type: object
      description: BindPasswordSecretRef is never serialized.
      properties:
        tenantId: { type: string, format: uuid }
        host: { type: string }
        port: { type: integer }
        useTls: { type: boolean }
        bindDn: { type: string }
        userBaseDn: { type: string }
        userFilter: { type: string }
        groupBaseDn: { type: string }
        groupAttribute: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SAMLConfig:
      type: object
      description: SPCertSecretRef/SPKeySecretRef are never serialized.
      properties:
        tenantId: { type: string, format: uuid }
        idpMetadataUrl: { type: string, nullable: true }
        idpMetadataXml: { type: string, nullable: true }
        spEntityId: { type: string }
        acsUrl: { type: string }
        groupAttribute: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StorageConfig:
      type: object
      description: >
        Secret-reference fields (access key/service-account JSON/OAuth
        refresh token) are never serialized.
      properties:
        tenantId: { type: string, format: uuid }
        provider:
          type: string
          enum: [s3, gcs, gdrive]
        s3Bucket: { type: string, nullable: true }
        s3Region: { type: string, nullable: true }
        s3AccessKeyId: { type: string, nullable: true }
        gcsBucket: { type: string, nullable: true }
        gcsProjectId: { type: string, nullable: true }
        gdriveFolderId: { type: string, nullable: true }
        gdriveAuthMethod:
          type: string
          nullable: true
          enum: [service_account, oauth]
        gdriveOauthConnectedEmail:
          type: string
          nullable: true
          description: Display only, set once the OAuth "Connect your Google account" flow completes.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SlackConfig:
      type: object
      description: Bot token is never serialized. Null response means no workspace is connected.
      properties:
        tenantId: { type: string, format: uuid }
        teamId: { type: string }
        teamName: { type: string }
        botUserId: { type: string }
        installedByUserId: { type: string, format: uuid }
        installedByUserName:
          type: string
          description: Denormalized via a join, for display ("connected by ...").
        grantedScopes:
          type: string
          description: Comma-separated, exactly as Slack's oauth.v2.access response returned it.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SMTPConfig:
      type: object
      description: PasswordSecretRef is never serialized.
      properties:
        tenantId: { type: string, format: uuid }
        host: { type: string }
        port: { type: integer }
        useTls: { type: boolean }
        username: { type: string }
        fromAddress: { type: string }
        fromName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RetentionConfig:
      type: object
      description: >
        GET never returns null -- configured=false means these are the
        synthesized 18-month defaults, not a value ever actually saved.
      properties:
        tenantId: { type: string, format: uuid }
        alertRetentionMonths: { type: integer, minimum: 0 }
        incidentRetentionMonths: { type: integer, minimum: 0 }
        configured: { type: boolean }
        updatedAt: { type: string, format: date-time, nullable: true }

    AdminAuditLogEntry:
      type: object
      description: >
        One Settings change, plus the actor's display name (resolved
        server-side -- includes deactivated users, so a past entry's actor
        still shows a name even after they're deactivated). `data`'s shape
        varies by area/action: always a {"from": ..., "to": ...} diff, but
        the fields inside are specific to whatever that area/action pair
        changed.
      properties:
        id: { type: integer, format: int64 }
        tenantId: { type: string, format: uuid }
        area: { type: string, example: retention }
        action: { type: string, example: save }
        actorType: { type: string, enum: [user, system, ai] }
        actorId: { type: string, format: uuid }
        actorName: { type: string }
        data: { type: object }
        createdAt: { type: string, format: date-time }

    AdminAuditLogPage:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AdminAuditLogEntry'
        nextCursor:
          type: object
          nullable: true
          description: Present only if more pages remain -- pass its fields as beforeCreatedAt/beforeId on the next call.
          properties:
            createdAt: { type: string, format: date-time }
            id: { type: integer, format: int64 }

    OnCallWorkingHoursMode:
      type: string
      enum: [all_day, specific_times]

    OnCallParticipant:
      type: object
      description: One member of the rotation, in order. userName is denormalized via a join.
      properties:
        userId: { type: string, format: uuid }
        userName: { type: string }

    OnCallWorkingHoursInterval:
      type: object
      description: >
        Restricts the rotation to specific weekdays and a time-of-day window
        -- only consulted when the schedule's workingHoursMode is
        specific_times.
      properties:
        id: { type: string, format: uuid }
        weekdays:
          type: array
          items: { type: integer }
          description: 0=Sunday .. 6=Saturday
        startMinute:
          type: integer
          description: Minutes since midnight, tenant timezone.
        endMinute: { type: integer }

    OnCallOverride:
      type: object
      description: Pins a single calendar date to a specific analyst, overriding the computed rotation for that whole day.
      properties:
        id: { type: string, format: uuid }
        date:
          type: string
          description: YYYY-MM-DD, in the tenant's timezone.
        userId: { type: string, format: uuid }
        userName: { type: string }
        createdAt: { type: string, format: date-time }

    OnCallSchedule:
      type: object
      description: >
        Any number per tenant (e.g. one rotation per team) -- exactly one is
        marked isDefault, which automatic alert assignment and escalation
        resolve the on-call analyst against.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        isDefault: { type: boolean }
        timezone:
          type: string
          description: Denormalized from the tenant's configured timezone, not per-schedule.
        participants:
          type: array
          items: { $ref: '#/components/schemas/OnCallParticipant' }
        handoverAt: { type: string, format: date-time }
        periodDays: { type: integer }
        concurrentShifts: { type: integer }
        workingHoursMode: { $ref: '#/components/schemas/OnCallWorkingHoursMode' }
        workingHours:
          type: array
          items: { $ref: '#/components/schemas/OnCallWorkingHoursInterval' }
        overrides:
          type: array
          items: { $ref: '#/components/schemas/OnCallOverride' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SaveOnCallScheduleRequest:
      type: object
      properties:
        name: { type: string }
        participantIds:
          type: array
          items: { type: string, format: uuid }
          description: Ordered -- rotation groups are formed from this order.
        handoverAt: { type: string, format: date-time }
        periodDays: { type: integer }
        concurrentShifts: { type: integer }
        workingHoursMode: { $ref: '#/components/schemas/OnCallWorkingHoursMode' }
        workingHours:
          type: array
          items:
            type: object
            properties:
              weekdays:
                type: array
                items: { type: integer }
              startMinute: { type: integer }
              endMinute: { type: integer }
      required: [name, participantIds, handoverAt, periodDays, concurrentShifts, workingHoursMode]

    IncidentSLAPolicy:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        severity: { $ref: '#/components/schemas/Severity' }
        priority: { $ref: '#/components/schemas/IncidentPriority' }
        dueWithinMinutes: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EscalationStep:
      type: object
      description: >
        One link in an escalation policy's chain. position is 0-indexed and
        dense (0..len(steps)-1). destinationSecretRef is never serialized --
        resolved server-side only.
      properties:
        id: { type: string, format: uuid }
        policyId: { type: string, format: uuid }
        position: { type: integer }
        scheduleId:
          type: string
          format: uuid
          description: Which on-call schedule this step resolves the on-call analyst against -- not necessarily the tenant's default schedule.
        scheduleName: { type: string }
        delayMinutes:
          type: integer
          description: How long to wait after the previous event before this step fires.
        channelType: { $ref: '#/components/schemas/EscalationChannelType' }
        webhookPayloadTemplate:
          type: string
          nullable: true
          description: Only meaningful when channelType is webhook; omitted/null means send the default fixed JSON payload shape.

    SaveEscalationStepRequest:
      type: object
      properties:
        scheduleId: { type: string, format: uuid }
        delayMinutes: { type: integer }
        channelType: { $ref: '#/components/schemas/EscalationChannelType' }
        destination:
          type: string
          description: Plaintext destination (e.g. Slack webhook URL, PagerDuty routing key); empty on update keeps the existing one for that position.
        webhookPayloadTemplate:
          type: string
          description: Only applies when channelType is webhook; empty means send the default fixed payload shape.
      required: [scheduleId, delayMinutes, channelType]

    EscalationPolicy:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        severity: { $ref: '#/components/schemas/Severity' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/EscalationStep' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AlertTrendPoint:
      type: object
      properties:
        day: { type: string }
        alertCount: { type: integer }
        avgMttrSeconds: { type: number, nullable: true }

    IncidentTrendPoint:
      type: object
      properties:
        day: { type: string }
        incidentCount: { type: integer }

    NamedCount:
      type: object
      description: A breakdown row keyed by identity; a nil id is the "unassigned"/"no commander yet" bucket.
      properties:
        id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        count: { type: integer }

    DashboardStats:
      type: object
      properties:
        openAlerts: { type: integer }
        criticalAlerts: { type: integer }
        highAlerts: { type: integer }
        activeIncidents: { type: integer }
        slaBreachedCount: { type: integer }
        p1OpenCount: { type: integer }
        incidentAvgMttaSeconds: { type: number, nullable: true }
        incidentAvgMttrSeconds: { type: number, nullable: true }
        alertAvgMttaSeconds: { type: number, nullable: true }
        alertAvgMttrSeconds: { type: number, nullable: true }
        alertTrend:
          type: array
          items: { $ref: '#/components/schemas/AlertTrendPoint' }
        incidentTrend:
          type: array
          items: { $ref: '#/components/schemas/IncidentTrendPoint' }
        alertsBySeverity:
          type: object
          additionalProperties: { type: integer }
        alertStatusDistribution:
          type: object
          additionalProperties: { type: integer }
        incidentsByPriority:
          type: object
          additionalProperties: { type: integer }
        incidentsByPhase:
          type: object
          additionalProperties: { type: integer }
        alertsByAnalyst:
          type: array
          items: { $ref: '#/components/schemas/NamedCount' }
        incidentsByCommander:
          type: array
          items: { $ref: '#/components/schemas/NamedCount' }

    ActivityEvent:
      type: object
      description: One row of the Dashboard's Recent Activity feed -- a union of alert_events and incident_events, newest first.
      properties:
        kind:
          type: string
          enum: [alert, incident]
        contextId: { type: string, format: uuid }
        contextTitle: { type: string }
        eventType: { type: string }
        actorType: { $ref: '#/components/schemas/ActorType' }
        actorId: { type: string, format: uuid, nullable: true }
        data:
          description: Event-type-specific JSON payload.
        createdAt: { type: string, format: date-time }

    FollowupView:
      type: object
      properties:
        alerts:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
        incidents:
          type: array
          items: { $ref: '#/components/schemas/Incident' }

    TargetDBConfig:
      type: object
      properties:
        host: { type: string }
        port: { type: integer }
        database: { type: string }
        user: { type: string }
        password: { type: string }
        sslMode: { type: string }
      required: [host, port, database, user, password]

    TableRowCount:
      type: object
      properties:
        source: { type: integer, format: int64 }
        target: { type: integer, format: int64 }

    MigrationResult:
      type: object
      properties:
        schemaVersion: { type: integer }
        rowCounts:
          type: object
          additionalProperties: { $ref: '#/components/schemas/TableRowCount' }
        appDsn:
          type: string
          description: Connection string for api/ingest to use against the new database.
        workerDsn:
          type: string
          description: Connection string for cmd/worker (its own BYPASSRLS role) to use against the new database.
