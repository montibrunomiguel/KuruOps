      responses:
        "200":
          description: Group mappings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthGroupMapping' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/settings/users/group-mappings/{provider}/{group}:
    put:
      tags: [Settings - Users]
      summary: Create or update a group-to-role mapping
      description: Applied just-in-time on every federated login, so IdP group membership changes take effect without manual user edits.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/AuthProvider' }
        - name: group
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleId: { type: string, format: uuid }
              required: [roleId]
      responses:
        "200":
          description: Mapping saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthGroupMapping' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/users/group-mappings/{id}:
    delete:
      tags: [Settings - Users]
      summary: Delete a group-to-role mapping
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Mapping deleted
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

