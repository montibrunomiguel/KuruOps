    post:
      tags: [Settings - Users]
      summary: Revoke a user's active refresh tokens
      description: Does not deactivate the account; the current access token still works until its own 15-minute expiry.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "204":
          description: Sessions revoked
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/settings/users/group-mappings:
