      tags: [Settings - Escalation Policies]
      summary: Send a real test notification through one step of an already-saved chain
      description: >
        Lets an admin confirm a destination (and, for webhook, a custom
        payload template with the analyst placeholders) actually works
        without waiting for a real alert to escalate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                severity: { $ref: '#/components/schemas/Severity' }
