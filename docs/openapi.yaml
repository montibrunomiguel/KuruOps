  # ----------------------------------------------------------- Settings: Users
  /api/v1/settings/users:
    get:
      tags: [Settings - Users]
      summary: List all users (admin view)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Settings - Users]
      summary: Create a local user
      description: >-
        Response includes a one-time temporaryPassword the admin must relay
        to the user. Access is granted entirely via roleId (see Settings -
        Roles) -- a user has no resourceAccess/allowedTags of its own,
        those live on the assigned Role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                name: { type: string }
                phone: { type: string }
                roleId: { type: string, format: uuid }
              required: [email, name, roleId]
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  temporaryPassword: { type: string }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/users/{id}/access:
    put:
      tags: [Settings - Users]
      summary: Reassign a user's role
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleId: { type: string, format: uuid }
              required: [roleId]
      responses:
        "204":
          description: Role reassigned
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

