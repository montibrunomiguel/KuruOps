openapi: 3.0.3
info:
  title: ArgusOps API
  version: "0.1.0"
  description: >
    REST API for ArgusOps, a single-tenant SOC alert/incident-management
    platform (Go backend, PostgreSQL, React frontend). This document covers
    every route mounted by internal/httpserver/router.go: the unauthenticated
    /auth/** login flows, /healthz and /metrics, and the JWT-protected
    /api/v1/** surface (alerts, incidents, playbooks, tags, uploads,
    dashboard, live event stream, and admin-only /settings/** configuration).
    See the repository root README for product context, deployment, and the
    default-admin-first-login flow; see TROUBLESHOOTING.md for operational
    issues. This spec favors completeness of shape (paths, params, request/
    response bodies, status codes) over exhaustive field-level validation
    constraints.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Unauthenticated login/session flows, mounted at /auth.
  - name: Account
    description: Self-service account management for the calling user.
  - name: Alerts
    description: Alert triage, requires the "alerts" resourceAccess capability.
  - name: Incidents
    description: Incident response (NIST 800-61 lifecycle), requires the "incidents" resourceAccess capability.
  - name: Playbooks
    description: Shared reference playbooks, any authenticated user.
  - name: Tags
    description: Read-only tag catalog, any authenticated user.
  - name: Uploads
    description: Evidence image attachments for alerts/incidents.
  - name: Users
    description: Minimal user directory, any authenticated user.
  - name: Dashboard
    description: KPI/trend aggregates and the Follow-up view.
  - name: Events
    description: Live server-sent-event stream of alert/incident activity.
  - name: Settings - Webhooks
    description: Admin-only ingest webhook endpoint management.
  - name: Settings - LLM Providers
    description: Admin-only "Analyze with AI" provider configuration.
  - name: Settings - MCP Servers
    description: Admin-only MCP tool-server configuration and tool-call approvals.
  - name: Settings - Users
    description: Admin-only user/role/access management and IdP group mappings.
  - name: Settings - Identity Providers
    description: Admin-only LDAP/SAML configuration.
  - name: Settings - Tags
    description: Admin-only tag catalog management.
  - name: Settings - Storage
    description: Admin-only S3/GCS evidence-storage configuration.
  - name: Settings - SMTP
    description: Admin-only outbound email configuration.
  - name: Settings - On-Call Shifts
    description: Admin-only weekly on-call schedule.
  - name: Settings - Incident SLA
    description: Admin-only per-severity/priority SLA policy.
  - name: Settings - Escalation Policies
    description: Admin-only unacknowledged-alert escalation rules.
  - name: Settings - Audit Export
    description: Admin-only CEF audit log export.
  - name: Settings - Database Migration
    description: Admin-only one-time cutover to an externally hosted database.
  - name: System
    description: Unauthenticated health/metrics endpoints.

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- System
  /healthz:
    get:
      tags: [System]
      summary: Liveness check
      description: Unauthenticated. Always returns 200 with a plain "ok" body when the process is up.
      security: []
      responses:
        "200":
          description: Service is up
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics
      description: Unauthenticated. Exposes process/HTTP metrics in Prometheus text exposition format.
      security: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  # ------------------------------------------------------------------ Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Local username/password login
      description: >
        Unauthenticated. Rate limited per-IP (router-level) and per-email
        (handler-level). Resolves the deployment's single tenant automatically.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: Invalid credentials
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: Too many login attempts for this account or IP
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/login/ldap:
    post:
      tags: [Auth]
      summary: LDAP login
      description: Unauthenticated. Same rate limiting as local login; validates against the tenant's configured LDAP directory.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: Invalid credentials
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: Too many login attempts
          content:
            text/plain:
              schema:
                type: string

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      description: Unauthenticated (the refresh token itself is the credential). Rotates the refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required: [refreshToken]
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refreshToken:
                    type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: Invalid or expired refresh token
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/saml/metadata:
    get:
      tags: [Auth]
      summary: SAML SP metadata document
      description: Unauthenticated. Serves this tenant's SP metadata XML for IdP configuration.
      security: []
      responses:
        "200":
          description: SP metadata XML
          content:
            application/xml:
              schema:
                type: string
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/saml/login:
    get:
      tags: [Auth]
      summary: Initiate SAML login (redirect to IdP)
      description: Unauthenticated. Redirects the browser to the configured IdP's SSO endpoint.
      security: []
      responses:
        "302":
          description: Redirect to the IdP
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/saml/acs:
    post:
      tags: [Auth]
      summary: SAML Assertion Consumer Service callback
      description: Unauthenticated. The IdP posts the SAML assertion here to complete login.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLResponse:
                  type: string
      responses:
        "200":
          description: Login completed (response shape mirrors LoginResponse, rendered/redirected by the SAML handler)
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: Invalid SAML assertion
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: >
        Unauthenticated. Always returns 204 regardless of whether the email
        matches a real, local, active account -- the response never leaks
        account existence.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required: [email]
      responses:
        "204":
          description: Request accepted (no content, regardless of outcome)
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          description: Too many attempts for this account
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirm a password reset with a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                newPassword:
                  type: string
              required: [token, newPassword]
      responses:
        "204":
          description: Password reset
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          description: Too many attempts
          content:
            text/plain:
              schema:
                type: string

  # --------------------------------------------------------------- Account
  /api/v1/account/change-password:
    post:
      tags: [Account]
      summary: Change the calling user's password
      description: >
        The one route exempt from the "must change password" lockout (see
        RequirePasswordChanged), since it's how that lockout gets cleared.
        Re-issues the session token with mustChangePassword cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
              required: [currentPassword, newPassword]
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/account/profile:
    put:
      tags: [Account]
      summary: Update the calling user's name/email
      description: Local-auth accounts only; changing email requires re-confirming the current password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                currentPassword:
                  type: string
              required: [name, email]
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------- Alerts
  /api/v1/alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      description: Requires the "alerts" resourceAccess capability. Results are further filtered to the caller's allowedTags.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AlertStatus' }
        - name: source
          in: query
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: correlated
          in: query
          description: 'true or false; filters to alerts that are/aren''t linked to another alert.'
          schema: { type: string }
        - name: since
          in: query
          description: RFC3339 lower bound on receivedAt. Malformed values are silently ignored (treated as absent).
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Matching alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/alerts/{id}:
    get:
      tags: [Alerts]
      summary: Get an alert
      description: Includes latestAnalysis (unlike the list endpoint).
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        "200":
          description: The alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/alerts/{id}/status:
    post:
      tags: [Alerts]
      summary: Change an alert's status
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/AlertStatus' }
              required: [status]
      responses:
        "204":
          description: Status changed
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/close:
    post:
      tags: [Alerts]
      summary: Close and classify an alert
      description: Classification is only ever set through this endpoint (the "Close & Classify Alert" flow).
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                classification: { $ref: '#/components/schemas/Classification' }
                comment: { type: string }
                imageUrl: { type: string, nullable: true }
              required: [classification, comment]
      responses:
        "204":
          description: Alert closed
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/tags:
    put:
      tags: [Alerts]
      summary: Replace an alert's tags
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items: { type: string }
              required: [tags]
      responses:
        "204":
          description: Tags updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/severity:
    put:
      tags: [Alerts]
      summary: Override an alert's severity
      description: Original severity (as received) stays recorded in originalSeverity.
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                severity: { $ref: '#/components/schemas/Severity' }
              required: [severity]
      responses:
        "204":
          description: Severity overridden
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/assignee:
    put:
      tags: [Alerts]
      summary: Reassign (or unassign) an alert's analyst
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                analystId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Omit/null to unassign.
      responses:
        "204":
          description: Assignee updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/alerts:
    get:
      tags: [Alerts]
      summary: List alerts linked to this alert (correlation)
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        "200":
          description: Linked alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/alerts/{otherId}:
    put:
      tags: [Alerts]
      summary: Link two alerts together (correlation)
      parameters:
        - $ref: '#/components/parameters/AlertId'
        - name: otherId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Linked
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Alerts]
      summary: Unlink two alerts
      parameters:
        - $ref: '#/components/parameters/AlertId'
        - name: otherId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Unlinked
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/escalate:
    post:
      tags: [Alerts]
      summary: Escalate an alert into a new incident
      description: >
        Creates a new incident (title/severity/tags copied from the alert,
        priority defaults to p3), links the alert to it, and marks the alert
        'escalated'. The one endpoint that touches both the Alerts and
        Incidents aggregates.
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        "200":
          description: Incident created from this alert
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidentId:
                    type: string
                    format: uuid
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/alerts/{id}/analyze:
    post:
      tags: [Alerts]
      summary: Run "Analyze with AI" on this alert
      description: Synchronous -- blocks for the duration of the LLM call (can take several seconds).
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/comments:
    get:
      tags: [Alerts]
      summary: List Team Notes comments on an alert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertComment' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Alerts]
      summary: Add a Team Notes comment to an alert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                imageUrl: { type: string, nullable: true }
              required: [body]
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertComment' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------- Incidents
  /api/v1/incidents:
    get:
      tags: [Incidents]
      summary: List incidents
      description: Requires the "incidents" resourceAccess capability.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/IncidentPriority' }
        - name: phase
          in: query
          schema: { $ref: '#/components/schemas/IncidentPhase' }
        - name: tag
          in: query
          schema: { type: string }
        - name: since
          in: query
          description: RFC3339 lower bound on openedAt.
          schema: { type: string, format: date-time }
        - name: commanderId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Matching incidents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Incident' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Incidents]
      summary: Create an incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                severity: { $ref: '#/components/schemas/Severity' }
                priority: { $ref: '#/components/schemas/IncidentPriority' }
                assigneeIds:
                  type: array
                  items: { type: string, format: uuid }
                tags:
                  type: array
                  items: { type: string }
              required: [title, severity, priority]
      responses:
        "201":
          description: Incident created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}:
    get:
      tags: [Incidents]
      summary: Get an incident
      description: Includes roles (unlike the list endpoint).
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: The incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/incidents/{id}/phase:
    post:
      tags: [Incidents]
      summary: Change an incident's NIST phase
      description: Jumping directly to any phase is allowed by design; a forward skip is logged, not rejected.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phase: { $ref: '#/components/schemas/IncidentPhase' }
              required: [phase]
      responses:
        "204":
          description: Phase changed
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/close:
    post:
      tags: [Incidents]
      summary: Close an incident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "204":
          description: Incident closed
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/severity-priority:
    post:
      tags: [Incidents]
      summary: Set an incident's severity and priority
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                severity: { $ref: '#/components/schemas/Severity' }
                priority: { $ref: '#/components/schemas/IncidentPriority' }
              required: [severity, priority]
      responses:
        "204":
          description: Updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/description:
    put:
      tags: [Incidents]
      summary: Edit an incident's description
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
              required: [description]
      responses:
        "204":
          description: Description updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/tags:
    put:
      tags: [Incidents]
      summary: Replace an incident's tags
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items: { type: string }
              required: [tags]
      responses:
        "204":
          description: Tags updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/assignees:
    put:
      tags: [Incidents]
      summary: Replace an incident's assignees
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigneeIds:
                  type: array
                  items: { type: string, format: uuid }
              required: [assigneeIds]
      responses:
        "204":
          description: Assignees updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/roles/{role}:
    put:
      tags: [Incidents]
      summary: Assign users to a NIST 800-61 team role
      description: >
        Role comes from the path (one of commander, incident_handler,
        communications_lead, privacy_officer, technical_lead). commander and
        technical_lead are single-assignee; an unknown role is a 400, not a
        routing 404.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: role
          in: path
          required: true
          schema: { $ref: '#/components/schemas/IncidentRole' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items: { type: string, format: uuid }
              required: [userIds]
      responses:
        "204":
          description: Role assignment updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/status-history:
    get:
      tags: [Incidents]
      summary: List an incident's NIST phase history
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: Phase history entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncidentStatusHistoryEntry' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/incidents/{id}/status-history/{phase}/correct:
    post:
      tags: [Incidents]
      summary: Correct a phase-entry timestamp
      description: >
        The original enteredAt is never mutated -- this fills
        correctedEnteredAt/correctedBy/correctionReason alongside it so the
        original stays intact for audit.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: phase
          in: path
          required: true
          schema: { $ref: '#/components/schemas/IncidentPhase' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enteredAt:
                  type: string
                  format: date-time
                reason:
                  type: string
              required: [enteredAt, reason]
      responses:
        "204":
          description: Correction recorded
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/timeline:
    get:
      tags: [Incidents]
      summary: Get an incident's full audit timeline
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncidentEvent' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/incidents/{id}/comments:
    get:
      tags: [Incidents]
      summary: List Team Notes comments on an incident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncidentComment' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Incidents]
      summary: Add a Team Notes comment to an incident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                imageUrl: { type: string, nullable: true }
              required: [body]
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentComment' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/incidents/{id}/alerts:
    get:
      tags: [Incidents]
      summary: List alerts linked to this incident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: Linked alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/incidents/{id}/alerts/{alertId}:
    put:
      tags: [Incidents]
      summary: Link an alert to this incident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: alertId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Linked
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Incidents]
      summary: Unlink an alert from this incident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: alertId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Unlinked
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/analyze:
    post:
      tags: [Incidents]
      summary: Run "Analyze with AI" on this incident
      description: Synchronous -- blocks for the duration of the LLM call.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  # ------------------------------------------------------------- Playbooks
  /api/v1/playbooks:
    get:
      tags: [Playbooks]
      summary: List playbooks
      description: Not gated by resourceAccess -- shared reference material for both alerts and incidents.
      responses:
        "200":
          description: Playbooks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Playbook' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Playbooks]
      summary: Create a playbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePlaybookRequest'
      responses:
        "201":
          description: Playbook created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playbook' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/playbooks/{id}:
    get:
      tags: [Playbooks]
      summary: Get a playbook
      parameters:
        - $ref: '#/components/parameters/PlaybookId'
      responses:
        "200":
          description: The playbook
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playbook' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Playbooks]
      summary: Update a playbook
      parameters:
        - $ref: '#/components/parameters/PlaybookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePlaybookRequest'
      responses:
        "200":
          description: Playbook updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playbook' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Playbooks]
      summary: Delete a playbook
      parameters:
        - $ref: '#/components/parameters/PlaybookId'
      responses:
        "204":
          description: Playbook deleted
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/playbooks/match:
    get:
      tags: [Playbooks]
      summary: Find the best-matching playbook for an alert title
      description: Backs the "Related Playbook" auto-suggestion panel on Alert Detail.
      parameters:
        - name: title
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Best match, or null if no playbook's keywords match
          content:
            application/json:
              schema:
                type: object
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/Playbook'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------------ Tags
  /api/v1/tags:
    get:
      tags: [Tags]
      summary: List the tag catalog
      description: Read-only, any authenticated user. Managing the catalog is admin-only, see /settings/tags.
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  # --------------------------------------------------------------- Uploads
  /api/v1/uploads/images:
    post:
      tags: [Uploads]
      summary: Upload an evidence image
      description: >
        multipart/form-data with fields kind ("alert" or "incident"), id (the
        alert/incident UUID), and file (PNG/JPEG/GIF/WebP, sniffed
        server-side, max 5MB). Any authenticated user.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [alert, incident]
                id:
                  type: string
                  format: uuid
                file:
                  type: string
                  format: binary
              required: [kind, id, file]
      responses:
        "201":
          description: File stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: Path to GET the file back, e.g. /api/v1/uploads/images/Alert/2026/08/07/<id>_<slug>/<uuid>.png
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Referenced alert/incident not found or not visible to the caller's tag scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/uploads/images/{key}:
    get:
      tags: [Uploads]
      summary: Fetch a stored evidence image
      description: >
        The path after /images/ is the full object key (multiple "/"-separated
        segments: Alert|Incident/yyyy/mm/dd/<id>_<slug>/<uuid>.<ext>),
        represented here as a single opaque path parameter.
      parameters:
        - name: key
          in: path
          required: true
          description: Full object key, e.g. Alert/2026/08/07/3f2c.../3d9e....png
          schema: { type: string }
      responses:
        "200":
          description: Image bytes
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "400":
          description: Key fails the expected shape validation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  # ----------------------------------------------------------------- Users
  /api/v1/users/directory:
    get:
      tags: [Users]
      summary: Minimal {id, name} user directory
      description: >
        Any authenticated user, deliberately not under the admin-gated
        /settings/users -- used to resolve a display name for a userID (e.g.
        Incident.Assignees) or populate an assignee picker, without exposing
        role/email/resourceAccess.
      responses:
        "200":
          description: User summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserSummary' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------- Dashboard
  /api/v1/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: KPI cards, trend charts, and breakdowns
      description: Not gated by resourceAccess -- blends alert and incident KPIs into one summary.
      parameters:
        - name: alertSeverity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: alertStatus
          in: query
          schema: { $ref: '#/components/schemas/AlertStatus' }
        - name: alertSource
          in: query
          schema: { type: string }
        - name: alertTag
          in: query
          schema: { type: string }
        - name: assignedAnalystId
          in: query
          schema: { type: string, format: uuid }
        - name: incidentSeverity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: incidentTag
          in: query
          schema: { type: string }
        - name: commanderId
          in: query
          schema: { type: string, format: uuid }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardStats' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/dashboard/activity:
    get:
      tags: [Dashboard]
      summary: Recent Activity feed
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
        - name: kind
          in: query
          description: Filter to "alert" or "incident" activity; omit for both.
          schema: { type: string, enum: [alert, incident] }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Activity events, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityEvent' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/dashboard/followup:
    get:
      tags: [Dashboard]
      summary: Follow-up view (SLA-breached incidents + escalated/investigating alerts)
      description: Requires the "followup" resourceAccess capability, gated independently of "alerts"/"incidents".
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Follow-up view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowupView' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Events
  /api/v1/events/stream:
    get:
      tags: [Events]
      summary: Live alert/incident event stream (SSE)
      description: >
        text/event-stream, long-lived. Not gated by resourceAccess -- same
        reasoning as /dashboard. Each event is `event: <type>\ndata:
        <json>\n\n`; a `: ping\n\n` comment is sent every 25s to keep the
        connection alive through intermediate proxies.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: Streaming unsupported by the response writer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------ Settings: Webhooks
  /api/v1/settings/webhooks:
    get:
      tags: [Settings - Webhooks]
      summary: List webhook endpoints
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Webhook endpoints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookEndpoint' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Settings - Webhooks]
      summary: Create a webhook endpoint
      description: The bearer token is returned once, in this response only -- never retrievable again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                source: { type: string }
                expiresInDays:
                  type: integer
                  nullable: true
                  description: Omitted/null -> default 90d; 0 or negative -> never expires.
              required: [name, source]
      responses:
        "201":
          description: Endpoint created
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint: { $ref: '#/components/schemas/WebhookEndpoint' }
                  token: { type: string }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/webhooks/{id}/regenerate:
    post:
      tags: [Settings - Webhooks]
      summary: Regenerate a webhook endpoint's token
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInDays:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: New token (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/webhooks/{id}/disable:
    post:
      tags: [Settings - Webhooks]
      summary: Disable a webhook endpoint
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        "204":
          description: Disabled
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/webhooks/{id}/enable:
    post:
      tags: [Settings - Webhooks]
      summary: Re-enable a webhook endpoint
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        "204":
          description: Enabled
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  # --------------------------------------------------- Settings: LLM Providers
  /api/v1/settings/llm-providers:
    get:
      tags: [Settings - LLM Providers]
      summary: List LLM providers
      responses:
        "200":
          description: LLM providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LLMProvider' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Settings - LLM Providers]
      summary: Create an LLM provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveLLMProviderRequest'
