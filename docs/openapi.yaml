  # ------------------------------------------------- Settings: On-Call Shifts
  /api/v1/settings/on-call-shifts:
    get:
      tags: [Settings - On-Call Shifts]
      summary: Get the on-call schedule (timezone + shifts)
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone: { type: string }
                  shifts:
                    type: array
                    items: { $ref: '#/components/schemas/OnCallShift' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Settings - On-Call Shifts]
      summary: Create a weekly recurring shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId: { type: string, format: uuid }
                weekday:
                  type: integer
                  description: 0=Sunday .. 6=Saturday
                startMinute:
                  type: integer
                  description: Minutes since midnight, tenant timezone.
                endMinute:
                  type: integer
              required: [userId, weekday, startMinute, endMinute]
      responses:
        "201":
          description: Shift created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnCallShift' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/on-call-shifts/{id}:
    delete:
      tags: [Settings - On-Call Shifts]
      summary: Delete a shift
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/on-call-shifts/timezone:
    put:
      tags: [Settings - On-Call Shifts]
      summary: Set the tenant's on-call timezone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone: { type: string }
              required: [timezone]
      responses:
        "204":
          description: Timezone set
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  # ------------------------------------------------- Settings: Incident SLA
  /api/v1/settings/incident-sla:
    get:
      tags: [Settings - Incident SLA]
      summary: List incident SLA policies
      responses:
        "200":
          description: SLA policies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncidentSLAPolicy' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Settings - Incident SLA]
      summary: Create or update the SLA policy for a (severity, priority) pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                severity: { $ref: '#/components/schemas/Severity' }
                priority: { $ref: '#/components/schemas/IncidentPriority' }
                dueWithinMinutes: { type: integer }
              required: [severity, priority, dueWithinMinutes]
      responses:
        "200":
          description: Policy saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentSLAPolicy' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/incident-sla/{id}:
    delete:
      tags: [Settings - Incident SLA]
      summary: Delete an SLA policy
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------- Settings: Escalation Policies
  /api/v1/settings/escalation-policies:
    get:
      tags: [Settings - Escalation Policies]
      summary: List escalation policies
      responses:
        "200":
          description: Escalation policies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EscalationPolicy' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Settings - Escalation Policies]
      summary: Create or update the escalation policy for a severity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                severity: { $ref: '#/components/schemas/Severity' }
                unacknowledgedAfterMinutes: { type: integer }
                channelType: { $ref: '#/components/schemas/EscalationChannelType' }
                destination:
                  type: string
                  description: Plaintext destination (e.g. Slack webhook URL, PagerDuty routing key); empty on update keeps the existing one.
              required: [severity, unacknowledgedAfterMinutes, channelType]
      responses:
        "200":
          description: Policy saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EscalationPolicy' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/escalation-policies/{id}:
    delete:
      tags: [Settings - Escalation Policies]
      summary: Delete an escalation policy
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------- Settings: Audit Export
  /api/v1/settings/audit-export/cef:
    get:
      tags: [Settings - Audit Export]
      summary: Export the tenant's alert/incident event history as CEF
      description: >
        Downloadable text/plain CEF log. Supports keyset pagination:
        sinceCreatedAt/sinceEventId resume a previous pull; when more pages
        remain, the response carries X-Next-Cursor-Created-At and
        X-Next-Cursor-Event-Id headers for the next call.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 1000, maximum: 10000 }
        - name: sinceCreatedAt
          in: query
          description: RFC3339Nano cursor timestamp from a previous page's X-Next-Cursor-Created-At header.
          schema: { type: string, format: date-time }
        - name: sinceEventId
          in: query
          description: Cursor event id from a previous page's X-Next-Cursor-Event-Id header.
          schema: { type: string }
      responses:
        "200":
          description: CEF log lines
          headers:
            X-Next-Cursor-Created-At:
              description: Present only if more pages remain.
              schema: { type: string }
            X-Next-Cursor-Event-Id:
              description: Present only if more pages remain.
              schema: { type: string }
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  # -------------------------------------------- Settings: Database Migration
  /api/v1/settings/database-migration/test-connection:
    post:
      tags: [Settings - Database Migration]
      summary: Test connectivity to a target external database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetDBConfig'
      responses:
        "204":
          description: Connection succeeded
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/database-migration/migrate:
    post:
      tags: [Settings - Database Migration]
      summary: One-time cutover to an externally hosted database
      description: >
        Synchronous: tests the connection, replays schema migrations, sets
        up app/worker roles, and copies every row over in one blocking call
        (seconds to minutes depending on data volume). The returned DSNs must
        be put in DATABASE_URL for api/ingest and worker before restarting
        the stack against the new database -- this is a manual-restart
        cutover, not a live hot-swap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetDBConfig'
      responses:
        "200":
          description: Migration complete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MigrationResult' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Required on every /api/v1/** route. /auth/** is intentionally
        unauthenticated (that's how a session is obtained in the first
        place), and /healthz and /metrics are unauthenticated for
        infrastructure health checks and scraping. A caller whose
        mustChangePassword flag is still set can reach nothing under
        /api/v1/** except POST /api/v1/account/change-password (see
        RequirePasswordChanged), receiving 403 on everything else until the
        password is changed.

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size, 1-200. Invalid or out-of-range values fall back to the server default (50).
      schema: { type: integer, minimum: 1, maximum: 200 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0 }
    AlertId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncidentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlaybookId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LLMProviderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MCPServerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ToolCallId:
      name: callId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request body, path, or query parameter
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, malformed, or expired bearer token
      content:
        text/plain:
          schema:
            type: string
            description: >-
              Plain-text error message, issued by the auth middleware via
              http.Error -- not the handler-level JSON error shape used
              elsewhere in this API.
    Forbidden:
      description: Authenticated, but the caller's role/resourceAccess doesn't permit this action (or the account still must change its password)
      content:
        text/plain:
          schema:
            type: string
            description: >-
              Plain-text error message, issued by the auth middleware via
              http.Error -- not the handler-level JSON error shape used
              elsewhere in this API.
    NotFound:
      description: No resource with that id (or not visible under the caller's tag scope)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Unexpected server-side failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: Standard handler-level error shape, written by handlers.writeError.
      properties:
        error:
          type: string
      required: [error]

    Severity:
      type: string
      enum: [critical, high, medium, low, informational]
    AlertStatus:
      type: string
      enum: [open, investigating, escalated, closed]
    Classification:
      type: string
      enum: [false_positive, true_positive, authorized_event]
    IncidentPhase:
      type: string
      enum: [new, detection_analysis, containment, eradication, recovery, post_incident]
    IncidentPriority:
      type: string
      enum: [p1, p2, p3, p4]
    IncidentRole:
      type: string
      enum: [commander, technical_lead, incident_handler, communications_lead, privacy_officer]
    UserRole:
      type: string
      enum: [admin, analyst, viewer]
    AuthProvider:
      type: string
      enum: [local, ldap, saml]
    ActorType:
      type: string
      enum: [user, system, ai]
    ToolCallStatus:
      type: string
      enum: [proposed, approved, rejected, executed, failed]
    EscalationChannelType:
      type: string
      enum: [pagerduty, slack, webhook]
    ResourceAccess:
      type: array
      description: Capability set; any combination of the three values.
      items:
        type: string
        enum: [alerts, incidents, followup]

    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    User:
      type: object
      description: PasswordHash/MFATOTPSecret are never serialized (json:"-" in the Go struct).
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        authProvider: { $ref: '#/components/schemas/AuthProvider' }
        externalId: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/UserRole' }
        resourceAccess: { $ref: '#/components/schemas/ResourceAccess' }
        allowedTags:
          type: array
          items: { type: string }
          description: Empty = unrestricted, sees all tags.
        isActive: { type: boolean }
        mustChangePassword: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, tenantId, email, name, authProvider, role, resourceAccess, allowedTags, isActive, mustChangePassword, createdAt, updatedAt]

    AuthGroupMapping:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/AuthProvider' }
        externalGroup: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        resourceAccess: { $ref: '#/components/schemas/ResourceAccess' }
        allowedTags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    LoginRequest:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        token: { type: string }
        refreshToken: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            name: { type: string }
            role: { type: string }
            mustChangePassword: { type: boolean }

    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        externalId: { type: string, nullable: true }
        webhookEndpointId: { type: string, format: uuid, nullable: true }
        title: { type: string }
        source: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        originalSeverity: { $ref: '#/components/schemas/Severity' }
        status: { $ref: '#/components/schemas/AlertStatus' }
        classification:
          type: string
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Classification' }]
        closeComment: { type: string, nullable: true }
        closeImageUrl: { type: string, nullable: true }
        ruleId: { type: string, nullable: true }
        asset: { type: string, nullable: true }
        srcIp: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        payload:
          description: Unfiltered raw webhook body -- arbitrary JSON.
        metadata:
          description: Sender's curated key/value list; always an object, possibly empty, never null.
          type: object
        incidentId: { type: string, format: uuid, nullable: true }
        assignedAnalystId: { type: string, format: uuid, nullable: true }
        assignedAnalystName: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        latestAnalysis:
          type: string
          nullable: true
          description: Most recent completed "Analyze with AI" result. Only populated on GET of a single alert, not on list.
      required: [id, tenantId, title, source, severity, originalSeverity, status, tags, payload, metadata, receivedAt, createdAt, updatedAt]

    AlertComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        alertId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        body: { type: string }
        imageUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Incident:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        priority: { $ref: '#/components/schemas/IncidentPriority' }
        phase: { $ref: '#/components/schemas/IncidentPhase' }
        assignees:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        roles:
          type: array
          description: Only populated on GET of a single incident, not on list.
          items: { $ref: '#/components/schemas/IncidentRoleAssignment' }
        tags:
          type: array
          items: { type: string }
        slaDueAt: { type: string, format: date-time, nullable: true }
        slaBreached: { type: boolean }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, tenantId, title, description, severity, priority, phase, assignees, roles, tags, slaBreached, openedAt, createdAt, updatedAt]

    IncidentRoleAssignment:
      type: object
      properties:
        role: { $ref: '#/components/schemas/IncidentRole' }
        user: { $ref: '#/components/schemas/UserSummary' }

    IncidentStatusHistoryEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        phase: { $ref: '#/components/schemas/IncidentPhase' }
        enteredAt: { type: string, format: date-time }
        correctedEnteredAt: { type: string, format: date-time, nullable: true }
        correctedAt: { type: string, format: date-time, nullable: true }
        correctedBy: { type: string, format: uuid, nullable: true }
        correctionReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    IncidentEvent:
      type: object
      description: Append-only audit row; never updated after insert.
      properties:
        id: { type: integer, format: int64 }
        incidentId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        eventType:
          type: string
          enum: [created, phase_changed, phase_skipped, closed, severity_priority_changed, description_edited, tags_changed, alert_linked, alert_unlinked, ai_analysis_run, status_timestamp_corrected, assignees_changed, role_assigned, role_unassigned]
        actorType: { $ref: '#/components/schemas/ActorType' }
        actorId: { type: string, format: uuid, nullable: true }
        data:
          description: Event-type-specific JSON payload.
        createdAt: { type: string, format: date-time }

    IncidentComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorName: { type: string }
        body: { type: string }
        imageUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Playbook:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        title: { type: string }
        category: { type: string }
        description: { type: string }
        keywords:
          type: array
          items: { type: string }
        steps:
          type: object
          description: Map of NIST phase -> ordered action lines for that phase.
          additionalProperties:
            type: array
            items: { type: string }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SavePlaybookRequest:
      type: object
      properties:
        title: { type: string }
        category: { type: string }
        description: { type: string }
        keywords:
          type: array
          items: { type: string }
        steps:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
      required: [title]

    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    WebhookEndpoint:
      type: object
      description: TokenHash is never serialized; only the last 4 characters are exposed.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        source: { type: string }
        tokenLast4: { type: string }
        status: { type: string }
        rotatedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    LLMProvider:
      type: object
      description: APIKeySecretRef is never serialized; the key itself is never stored in this table.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string }
        baseUrl: { type: string, nullable: true }
        model: { type: string }
        isDefault: { type: boolean }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SaveLLMProviderRequest:
      type: object
      properties:
        name: { type: string }
        kind: { type: string }
        baseUrl: { type: string, nullable: true }
        model: { type: string }
        apiKey:
          type: string
          description: Write-only. Required on create; empty on update means "keep the existing key".
      required: [name, model]

    MCPServer:
      type: object
      description: AuthSecretRef is never serialized.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        transport: { type: string }
        endpointOrCommand: { type: string }
        allowedTools:
          type: array
          items: { type: string }
        enabledFor:
          type: array
          items: { type: string }
        sideEffectingTools:
          type: array
          items: { type: string }
          description: Subset of allowedTools that always require analyst approval before executing.
        isEnabled: { type: boolean }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SaveMCPServerRequest:
      type: object
      properties:
        name: { type: string }
        transport: { type: string }
        endpointOrCommand: { type: string }
        authToken:
          type: string
          description: Write-only.
        allowedTools:
          type: array
          items: { type: string }
        enabledFor:
          type: array
          items: { type: string }
        sideEffectingTools:
          type: array
          items: { type: string }
      required: [name, endpointOrCommand]

    MCPTool:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        inputSchema:
          description: JSON Schema describing the tool's arguments.

    AIToolCall:
      type: object
      description: Forensic log row of an MCP tool the analysis agent invoked or proposed.
      properties:
        id: { type: integer, format: int64 }
        tenantId: { type: string, format: uuid }
        mcpServerId: { type: string, format: uuid }
        toolName: { type: string }
        contextType:
          type: string
          enum: [alert, incident]
        contextId: { type: string, format: uuid }
        args:
          description: Arguments the agent proposed calling the tool with.
        result:
          description: Tool result, once executed.
        status: { $ref: '#/components/schemas/ToolCallStatus' }
        approvedBy: { type: string, format: uuid, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    LDAPConfig:
      type: object
      description: BindPasswordSecretRef is never serialized.
      properties:
        tenantId: { type: string, format: uuid }
        host: { type: string }
        port: { type: integer }
        useTls: { type: boolean }
        bindDn: { type: string }
        userBaseDn: { type: string }
        userFilter: { type: string }
        groupBaseDn: { type: string }
        groupAttribute: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SAMLConfig:
      type: object
      description: SPCertSecretRef/SPKeySecretRef are never serialized.
      properties:
        tenantId: { type: string, format: uuid }
        idpMetadataUrl: { type: string, nullable: true }
        idpMetadataXml: { type: string, nullable: true }
        spEntityId: { type: string }
        acsUrl: { type: string }
        groupAttribute: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StorageConfig:
      type: object
      description: Secret-reference fields (access key/service-account JSON) are never serialized.
      properties:
        tenantId: { type: string, format: uuid }
        provider:
          type: string
          enum: [s3, gcs]
        s3Bucket: { type: string, nullable: true }
        s3Region: { type: string, nullable: true }
        s3AccessKeyId: { type: string, nullable: true }
        gcsBucket: { type: string, nullable: true }
        gcsProjectId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SMTPConfig:
      type: object
      description: PasswordSecretRef is never serialized.
      properties:
        tenantId: { type: string, format: uuid }
        host: { type: string }
        port: { type: integer }
        useTls: { type: boolean }
        username: { type: string }
        fromAddress: { type: string }
        fromName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OnCallShift:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        userName: { type: string }
        weekday:
          type: integer
          description: 0=Sunday .. 6=Saturday
        startMinute: { type: integer }
        endMinute: { type: integer }
        createdAt: { type: string, format: date-time }

    IncidentSLAPolicy:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        severity: { $ref: '#/components/schemas/Severity' }
        priority: { $ref: '#/components/schemas/IncidentPriority' }
        dueWithinMinutes: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EscalationPolicy:
      type: object
      description: DestinationSecretRef is never serialized -- resolved server-side only.
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        severity: { $ref: '#/components/schemas/Severity' }
        unacknowledgedAfterMinutes: { type: integer }
        channelType: { $ref: '#/components/schemas/EscalationChannelType' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AlertTrendPoint:
      type: object
      properties:
        day: { type: string }
        alertCount: { type: integer }
        avgMttrSeconds: { type: number, nullable: true }

    IncidentTrendPoint:
      type: object
      properties:
        day: { type: string }
        incidentCount: { type: integer }

    NamedCount:
      type: object
      description: A breakdown row keyed by identity; a nil id is the "unassigned"/"no commander yet" bucket.
      properties:
        id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        count: { type: integer }

    DashboardStats:
      type: object
      properties:
        openAlerts: { type: integer }
        criticalAlerts: { type: integer }
        highAlerts: { type: integer }
        activeIncidents: { type: integer }
        slaBreachedCount: { type: integer }
        p1OpenCount: { type: integer }
        incidentAvgMttaSeconds: { type: number, nullable: true }
        incidentAvgMttrSeconds: { type: number, nullable: true }
        alertAvgMttaSeconds: { type: number, nullable: true }
        alertAvgMttrSeconds: { type: number, nullable: true }
        alertTrend:
          type: array
          items: { $ref: '#/components/schemas/AlertTrendPoint' }
        incidentTrend:
          type: array
          items: { $ref: '#/components/schemas/IncidentTrendPoint' }
        alertsBySeverity:
          type: object
          additionalProperties: { type: integer }
        alertStatusDistribution:
          type: object
          additionalProperties: { type: integer }
        incidentsByPriority:
          type: object
          additionalProperties: { type: integer }
        incidentsByPhase:
          type: object
          additionalProperties: { type: integer }
        alertsByAnalyst:
          type: array
          items: { $ref: '#/components/schemas/NamedCount' }
        incidentsByCommander:
          type: array
          items: { $ref: '#/components/schemas/NamedCount' }

    ActivityEvent:
      type: object
      description: One row of the Dashboard's Recent Activity feed -- a union of alert_events and incident_events, newest first.
      properties:
        kind:
          type: string
          enum: [alert, incident]
        contextId: { type: string, format: uuid }
        contextTitle: { type: string }
        eventType: { type: string }
        actorType: { $ref: '#/components/schemas/ActorType' }
        actorId: { type: string, format: uuid, nullable: true }
        data:
          description: Event-type-specific JSON payload.
        createdAt: { type: string, format: date-time }

    FollowupView:
      type: object
      properties:
        alerts:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
        incidents:
          type: array
          items: { $ref: '#/components/schemas/Incident' }

    TargetDBConfig:
      type: object
      properties:
        host: { type: string }
        port: { type: integer }
        database: { type: string }
        user: { type: string }
        password: { type: string }
        sslMode: { type: string }
      required: [host, port, database, user, password]

    TableRowCount:
      type: object
      properties:
        source: { type: integer, format: int64 }
        target: { type: integer, format: int64 }

    MigrationResult:
      type: object
      properties:
        schemaVersion: { type: integer }
        rowCounts:
          type: object
          additionalProperties: { $ref: '#/components/schemas/TableRowCount' }
        appDsn:
          type: string
          description: Connection string for api/ingest to use against the new database.
        workerDsn:
          type: string
          description: Connection string for cmd/worker (its own BYPASSRLS role) to use against the new database.
