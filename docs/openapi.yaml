openapi: 3.0.3
info:
  title: KuruOps API
  version: "0.1.0"
  description: >
    REST API for KuruOps, a single-tenant SOC alert/incident-management
    platform (Go backend, PostgreSQL, React frontend). This document covers
    every route mounted by internal/httpserver/router.go: the unauthenticated
    /auth/** login flows, /healthz and /metrics, and the JWT-protected
    /api/v1/** surface (alerts, incidents, playbooks, tags, uploads,
    dashboard, live event stream, and admin-only /settings/** configuration).
    See the repository root README for product context, deployment, and the
    default-admin-first-login flow; see TROUBLESHOOTING.md for operational
    issues. This spec favors completeness of shape (paths, params, request/
    response bodies, status codes) over exhaustive field-level validation
    constraints.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Unauthenticated login/session flows, mounted at /auth.
  - name: Account
    description: Self-service account management for the calling user.
  - name: Alerts
    description: Alert triage, requires the "alerts" resourceAccess capability.
  - name: Incidents
    description: Incident response (NIST 800-61 lifecycle), requires the "incidents" resourceAccess capability.
  - name: Playbooks
    description: Shared reference playbooks, any authenticated user.
  - name: Tags
    description: Read-only tag catalog, any authenticated user.
  - name: Uploads
    description: Evidence image attachments for alerts/incidents.
  - name: Users
    description: Minimal user directory, any authenticated user.
  - name: Dashboard
    description: KPI/trend aggregates and the Follow-up view.
  - name: Events
    description: Live server-sent-event stream of alert/incident activity.
  - name: Settings - Webhooks
    description: Admin-only ingest webhook endpoint management.
  - name: Settings - Field Mapping Templates
    description: >
      Admin-only catalog of reusable JSON-path field-mapping rule sets,
      assignable to zero or more Webhook Endpoints (Settings - Webhooks).
  - name: Settings - LLM Providers
    description: Admin-only "Analyze with AI" provider configuration.
  - name: Settings - MCP Servers
    description: Admin-only MCP tool-server configuration and tool-call approvals.
  - name: Settings - Users
    description: Admin-only user/role/access management and IdP group mappings.
  - name: Settings - Roles
    description: Admin-only named, reusable access bundles (isAdmin, resourceAccess, allowedTags) users and IdP group mappings are assigned to.
  - name: Settings - Identity Providers
    description: Admin-only LDAP/SAML configuration.
  - name: Settings - Tags
    description: Admin-only tag catalog management.
  - name: Settings - Storage
    description: Admin-only S3/GCS/Google Drive evidence-storage configuration.
  - name: Settings - SMTP
    description: Admin-only outbound email configuration.
  - name: Settings - Slack
    description: >
      Admin-only Slack workspace connect/disconnect (bot-token OAuth). This
      is the foundation only -- no message/thread/channel sync endpoints
      exist yet.
  - name: Settings - On-Call Schedules
    description: Admin-only on-call rotation schedules, working hours, and per-date overrides.
  - name: Settings - Incident SLA
    description: Admin-only per-severity/priority SLA policy.
  - name: Settings - Escalation Policies
    description: Admin-only unacknowledged-alert escalation rules.
  - name: Settings - Audit Log
    description: >
      Admin-only, read-only log of every change made across Settings (area,
      action, actor, before/after diff). Distinct from Settings - Audit
      Export, which covers alert/incident history for SIEM export, not
      Settings changes.
  - name: Settings - Audit Export
    description: Admin-only CEF/JSON audit log export.
  - name: Settings - Retention
    description: >
      Admin-only data retention policy -- how long a closed alert/incident
      stays in the tool before being permanently deleted.
  - name: Settings - Database Migration
    description: Admin-only one-time cutover to an externally hosted database.
  - name: System
    description: Unauthenticated health/metrics endpoints.

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- System
  /healthz:
    get:
      tags: [System]
      summary: Readiness check
      description: >-
        Unauthenticated. Pings the database (2s timeout) and returns 503 if
        unreachable -- correct for readiness (pull this replica from the
        load balancer until it can actually serve a request), but
        deliberately not used for a Kubernetes liveness probe: a transient
        Postgres blip would otherwise get every api/ingest/worker replica
        killed and restarted at once. Use /livez for that instead.
      security: []
      responses:
        "200":
          description: Service is up and the database is reachable
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "503":
          description: Database unreachable
          content:
            text/plain:
              schema:
                type: string
                example: database unreachable

  /livez:
    get:
      tags: [System]
      summary: Liveness check
      description: >-
        Unauthenticated. Unconditionally returns 200 -- a pure "this
        process is alive" check with no downstream dependency, unlike
        /healthz. This is the one to point a Kubernetes liveness probe at.
      security: []
      responses:
        "200":
          description: Process is up
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics
      description: Unauthenticated. Exposes process/HTTP metrics in Prometheus text exposition format.
      security: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  # ------------------------------------------------------------------ Auth
  /auth/login:
    post:
      tags: [Auth]
      summary: Local username/password login
      description: >
        Unauthenticated. Rate limited per-IP (router-level) and per-email
        (handler-level). Resolves the deployment's single tenant automatically.
        If the account has TOTP enrolled, a correct password returns
        MfaRequiredResponse instead of LoginResponse -- see /auth/mfa/verify
        for the second step.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login succeeded, or the account requires a second factor
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaRequiredResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: >-
            Invalid credentials. Unlike the shared Unauthorized response
            (issued by the auth middleware via http.Error, plain text),
            this comes from the handler itself via writeError -- the same
            application/json {"error": "..."} shape as every other
            handler-level error in this API.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "429":
          description: Too many login attempts for this account or IP -- same handler-level JSON error shape as 401 above
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Second step of a login for a TOTP-enrolled account
      description: >
        Unauthenticated. Consumes pendingToken (single-use) from a prior
        /auth/login response and checks code against the account's enrolled
        TOTP secret -- same opaque-failure discipline as /auth/login itself:
        an unknown/expired/already-used pendingToken and a wrong code are
        both a plain 401, never distinguished. Rate limited per pendingToken,
        same as /auth/password-reset/confirm is per reset token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pendingToken: { type: string }
                code: { type: string, description: The 6-digit TOTP code. }
              required: [pendingToken, code]
      responses:
        "200":
          description: Login completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: Invalid or expired pending token, or wrong code
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: Too many attempts for this pending token
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/login/ldap:
    post:
      tags: [Auth]
      summary: LDAP login
      description: Unauthenticated. Same rate limiting as local login; validates against the tenant's configured LDAP directory.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: Invalid credentials
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: Too many login attempts
          content:
            text/plain:
              schema:
                type: string

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      description: >-
        Unauthenticated (the refresh token itself is the credential). Rotates the refresh token.
        The token is read from the `kuruops_refresh` cookie only -- a `refreshToken` field in the
        request body is ignored, which is what stops a value scraped from anywhere else being
        replayed here. The rotated token comes back the same way, as a `Set-Cookie`, so it never
        passes through a response body that page scripts can read.
      security: []
      parameters:
        - in: cookie
          name: kuruops_refresh
          required: true
          schema:
            type: string
          description: Set at login. HttpOnly, SameSite=Strict, Path=/auth, and Secure whenever APP_BASE_URL is https.
      responses:
        "200":
          description: >-
            New access token issued, and a rotated refresh token set as a cookie. The user is
            included because the access token is never stored client-side: a page load (or a SAML
            callback) has only the cookie to go on and has to rebuild the session from this
            response alone.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: The rotated `kuruops_refresh` cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/LoginResponse/properties/user'
        "401":
          description: >-
            No cookie presented, or the token in it is unknown, expired or already rotated. The
            stale cookie is cleared on the way out.
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      description: >-
        Unauthenticated (same as /auth/refresh -- the refresh token itself is the credential).
        Revokes exactly the refresh token presented, not every session for the user -- logging out
        one browser/tab does not sign out sessions open elsewhere; use the admin "revoke sessions"
        action for that. Always returns 204 regardless of whether the token was known, already
        revoked, or omitted, so this endpoint cannot be used to probe token validity.
        The token is read from the `kuruops_refresh` cookie, which is cleared on the way out
        regardless of whether the revoke found anything.
      security: []
      parameters:
        - in: cookie
          name: kuruops_refresh
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Token revoked (or already invalid/omitted -- treated the same); the cookie is cleared
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Expires the `kuruops_refresh` cookie.
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/saml/metadata:
    get:
      tags: [Auth]
      summary: SAML SP metadata document
      description: Unauthenticated. Serves this tenant's SP metadata XML for IdP configuration.
      security: []
      responses:
        "200":
          description: SP metadata XML
          content:
            application/xml:
              schema:
                type: string
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/saml/login:
    get:
      tags: [Auth]
      summary: Initiate SAML login (redirect to IdP)
      description: Unauthenticated. Redirects the browser to the configured IdP's SSO endpoint.
      security: []
      responses:
        "302":
          description: Redirect to the IdP
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/saml/acs:
    post:
      tags: [Auth]
      summary: SAML Assertion Consumer Service callback
      description: >-
        Unauthenticated. The IdP posts the SAML assertion here to complete login. On success this
        sets the `kuruops_refresh` cookie and redirects to the SPA at `/login/saml`, which
        trades that cookie for an access token via `POST /auth/refresh`. No token is returned in
        this response: a credential in the body of an IdP-initiated POST ends up in browser history
        and proxy logs.

        The SAML flow has not been validated against a real identity provider -- see
        `backend/README.md`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLResponse:
                  type: string
      responses:
        "302":
          description: >-
            Assertion accepted. Sets the `kuruops_refresh` cookie and redirects to the SPA's
            `/login/saml`.
          headers:
            Location:
              schema:
                type: string
              description: "`APP_BASE_URL` + `/login/saml` -- never carries a token."
            Set-Cookie:
              schema:
                type: string
              description: The `kuruops_refresh` cookie.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          description: Invalid SAML assertion
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Request a password reset email
      description: >
        Unauthenticated. Always returns 204 regardless of whether the email
        matches a real, local, active account -- the response never leaks
        account existence.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required: [email]
      responses:
        "204":
          description: Request accepted (no content, regardless of outcome)
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          description: Too many attempts for this account
          content:
            text/plain:
              schema:
                type: string
        "500":
          $ref: '#/components/responses/InternalError'

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirm a password reset with a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                newPassword:
                  type: string
              required: [token, newPassword]
      responses:
        "204":
          description: Password reset
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          description: Too many attempts
          content:
            text/plain:
              schema:
                type: string

  /auth/oauth/gdrive/callback:
    get:
      tags: [Auth]
      summary: Google Drive OAuth callback
      description: >-
        Unauthenticated top-level browser redirect target -- not an XHR/JSON
        endpoint. code/state come from Google; on success or failure alike
        this always ends in a 302 back to Settings -> Storage
        (?gdrive_connected=1 or ?gdrive_error=...), never a JSON body. The
        real error (if any) is logged server-side only, never put in the
        redirect URL. See internal/httpserver/handlers/oauth_callback.go.
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          description: Present when the user declined consent, or Google itself rejected the request.
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the frontend's Storage settings page, either outcome

  /auth/oauth/slack/callback:
    get:
      tags: [Auth]
      summary: Slack OAuth callback
      description: >-
        Same shape as /auth/oauth/gdrive/callback, for Settings ->
        Conectores -> Slack (?slack_connected=1 or ?slack_error=...).
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the frontend's Slack settings page, either outcome

  # --------------------------------------------------------------- Account
  /api/v1/account/change-password:
    post:
      tags: [Account]
      summary: Change the calling user's password
      description: >
        The one route exempt from the "must change password" lockout (see
        RequirePasswordChanged), since it's how that lockout gets cleared.
        Re-issues the session token with mustChangePassword cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
              required: [currentPassword, newPassword]
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/account/profile:
    put:
      tags: [Account]
      summary: Update the calling user's name/email
      description: Local-auth accounts only; changing email requires re-confirming the current password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                currentPassword:
                  type: string
              required: [name, email]
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/account/mfa/enroll:
    post:
      tags: [Account]
      summary: Start (or restart) TOTP enrollment
      description: >-
        Generates a fresh random secret and its otpauth:// URI for the
        caller to render as a QR code -- deliberately NOT persisted here.
        The secret only reaches users.mfa_totp_secret via
        PUT /api/v1/account/mfa, once the caller has proven they actually
        captured it by producing a real code from it.
      responses:
        "200":
          description: A fresh, unsaved TOTP secret + its otpauth:// URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauthUrl: { type: string }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/account/mfa:
    put:
      tags: [Account]
      summary: Activate 2FA
      description: >-
        Re-validates code against the caller-supplied secret (the one
        POST /api/v1/account/mfa/enroll just handed out) before persisting
        it. Re-issues the session token with mfa_enabled now true, the same
        way change-password re-issues with mustChangePassword cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secret: { type: string }
                code: { type: string, description: The 6-digit TOTP code. }
              required: [secret, code]
      responses:
        "200":
          description: 2FA activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Account]
      summary: Disable 2FA
      description: >-
        Requires re-entering the current password -- a valid session alone
        isn't proof of intent to weaken the account's own login
        requirements, same reasoning as the email-change guard on
        PUT /api/v1/account/profile. Re-issues the session token with
        mfa_enabled now false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword: { type: string }
              required: [currentPassword]
      responses:
        "200":
          description: 2FA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/account/api-tokens:
    get:
      tags: [Account]
      summary: List the caller's own personal API tokens
      description: Never returns a token's plaintext value -- only tokenLast4, same convention as webhook endpoint tokens.
      responses:
        "200":
          description: The caller's API tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/APIToken' }
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Account]
      summary: Create a personal API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                expiresInDays:
                  type: integer
                  nullable: true
                  description: Omitted/null defaults to 90 days; 0 or negative means the token never expires.
              required: [name]
      responses:
        "201":
          description: >-
            Token created -- plaintext is included in this response body
            only, and is never retrievable again afterward.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { $ref: '#/components/schemas/APIToken' }
                  plaintext: { type: string }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/account/api-tokens/{id}:
    delete:
      tags: [Account]
      summary: Revoke a personal API token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoked
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Alerts
  /api/v1/alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      description: Requires the "alerts" resourceAccess capability. Results are further filtered to the caller's allowedTags.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AlertStatus' }
        - name: source
          in: query
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
        - name: correlated
          in: query
          description: 'true or false; filters to alerts that are/aren''t linked to another alert.'
          schema: { type: string }
        - name: q
          in: query
          description: Full-text search against title, source, ruleId and asset.
          schema: { type: string }
        - name: since
          in: query
          description: RFC3339 lower bound on receivedAt. Malformed values are silently ignored (treated as absent).
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Matching alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/alerts/{id}:
    get:
      tags: [Alerts]
      summary: Get an alert
      description: Includes latestAnalysis (unlike the list endpoint).
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        "200":
          description: The alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/alerts/bulk/status:
    post:
      tags: [Alerts]
      summary: Change the status of many alerts at once
      description: >-
        Applies ChangeStatus to each id in turn (one transaction per alert,
        not a single multi-row update), so every invariant that endpoint
        already enforces -- tag-visibility, the "closed is read-only" guard
        -- keeps working unmodified. A per-alert failure doesn't fail the
        whole request; the response reports one result per id. Direct
        transitions to "closed" are rejected per-item, same as the
        single-alert endpoint -- closing still requires the classification
        flow on the alert detail page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
                status: { $ref: '#/components/schemas/AlertStatus' }
              required: [ids, status]
      responses:
        "200":
          description: Per-alert results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResponse' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/status:
    post:
      tags: [Alerts]
      summary: Change an alert's status
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/AlertStatus' }
              required: [status]
      responses:
        "204":
          description: Status changed
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/close:
    post:
      tags: [Alerts]
      summary: Close and classify an alert
      description: Classification is only ever set through this endpoint (the "Close & Classify Alert" flow).
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                classification: { $ref: '#/components/schemas/Classification' }
                comment: { type: string }
                imageUrl: { type: string, nullable: true }
              required: [classification, comment]
      responses:
        "204":
          description: Alert closed
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/tags:
    put:
      tags: [Alerts]
      summary: Replace an alert's tags
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items: { type: string }
              required: [tags]
      responses:
        "204":
          description: Tags updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/severity:
    put:
      tags: [Alerts]
      summary: Override an alert's severity
      description: Original severity (as received) stays recorded in originalSeverity.
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                severity: { $ref: '#/components/schemas/Severity' }
              required: [severity]
      responses:
        "204":
          description: Severity overridden
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/assignee:
    put:
      tags: [Alerts]
      summary: Reassign (or unassign) an alert's analyst
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                analystId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Omit/null to unassign.
      responses:
        "204":
          description: Assignee updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/alerts:
    get:
      tags: [Alerts]
      summary: List alerts linked to this alert (correlation)
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        "200":
          description: Linked alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/{id}/alerts/{otherId}:
    put:
      tags: [Alerts]
      summary: Link two alerts together (correlation)
      parameters:
        - $ref: '#/components/parameters/AlertId'
        - name: otherId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Linked
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Alerts]
      summary: Unlink two alerts
      parameters:
        - $ref: '#/components/parameters/AlertId'
        - name: otherId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Unlinked
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/alerts/bulk/close:
    post:
      tags: [Alerts]
      summary: Close several alerts under one classification
      description: >
        Closing cannot ride on /alerts/bulk/status: a direct transition to
        'closed' is refused so that a classification is always captured.
        Answers 200 with a per-alert result list even when some fail, the
        same contract as /alerts/bulk/status -- one already-closed or
        tag-hidden alert does not stop the rest. An invalid classification is
        a single 400 rather than N identical failures. No attachment is
        accepted: an attachment is evidence about one specific alert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, classification]
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items: { type: string, format: uuid }
                classification:
                  type: string
                  enum: [false_positive, true_positive, authorized_event]
                comment:
                  type: string
                  description: Optional note recorded on every alert in the batch.
      responses:
        "200":
          description: Per-alert outcomes
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        success: { type: boolean }
                        error: { type: string }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/alerts/{id}/escalate:
    post:
      tags: [Alerts]
      summary: Escalate an alert into a new incident
      description: >
        Creates a new incident (title/severity/tags copied from the alert,
        priority seeded from the alert's severity), links the alert to it,
        and marks the alert 'escalated'. The one endpoint that touches both
        the Alerts and Incidents aggregates. All three writes share a single
        transaction, and an alert can only be escalated once -- a repeat call
        returns 409 rather than creating a second incident.
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        "200":
          description: Incident created from this alert
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidentId:
                    type: string
                    format: uuid
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: This alert has already been escalated to an incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/alerts/{id}/analyze:
    post:
      tags: [Alerts]
      summary: Start "Analyze with AI" on this alert
      description: >-
        Asynchronous -- kicks off the run in the background and returns 202
        immediately; the eventual result (or failure) shows up on the alert
        itself once a live-update event (see GET /api/v1/events/stream)
        tells a connected client to reload. Poll/subscribe and then read
        GET .../analyze/messages for the actual transcript. 409 if a run is
        already in progress or paused for this alert.
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        "202":
          description: Analysis started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: running }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/alerts/{id}/analyze/messages:
    get:
      tags: [Alerts]
      summary: Get this alert's AI analysis chat transcript
      description: >-
        Backs the analysis chat's initial load and its refetch on every
        live-update event -- the synthetic seed prompt (the auto-generated
        alert context dump) is never included, only messages an analyst or
        the model actually exchanged after that.
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        "200":
          description: The chat transcript
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatTranscript' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Alerts]
      summary: Continue this alert's AI analysis chat
      description: >-
        Asynchronous, same 202 shape as POST .../analyze: the analyst's own
        message is already persisted by the time this returns, but the
        model's reply isn't yet -- poll/subscribe and re-fetch GET
        .../analyze/messages. 409 if a run is already in progress or paused
        (resolve the pending tool call first, see .../tool-calls/{callId}).
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
              required: [text]
      responses:
        "202":
          description: Message accepted, next turn started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: running }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/alerts/{id}/analyze/tool-calls/{callId}/approve:
    post:
      tags: [Alerts]
      summary: Approve a tool call this alert's analysis chat is paused on
      description: >-
        Same underlying approval as
        POST /api/v1/settings/mcp-servers/tool-calls/{callId}/approve, but
        reachable without admin access to Settings -> MCP Servers -- gated
        here by confirming the call actually belongs to this alert first.
      parameters:
        - $ref: '#/components/parameters/AlertId'
        - $ref: '#/components/parameters/ToolCallId'
      responses:
        "204":
          description: Approved (and executed); the run resumes in the background
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No such tool call, or it doesn't belong to this alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/alerts/{id}/analyze/tool-calls/{callId}/reject:
    post:
      tags: [Alerts]
      summary: Reject a tool call this alert's analysis chat is paused on
      parameters:
        - $ref: '#/components/parameters/AlertId'
        - $ref: '#/components/parameters/ToolCallId'
      responses:
        "204":
          description: Rejected; the run resumes in the background
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No such tool call, or it doesn't belong to this alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/alerts/{id}/comments:
    get:
      tags: [Alerts]
      summary: List Team Notes comments on an alert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertComment' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Alerts]
      summary: Add a Team Notes comment to an alert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                imageUrl: { type: string, nullable: true }
              required: [body]
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertComment' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------- Incidents
  /api/v1/incidents:
    get:
      tags: [Incidents]
      summary: List incidents
      description: Requires the "incidents" resourceAccess capability.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/IncidentPriority' }
        - name: phase
          in: query
          schema: { $ref: '#/components/schemas/IncidentPhase' }
        - name: tag
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Full-text search against title and description.
          schema: { type: string }
        - name: since
          in: query
          description: RFC3339 lower bound on openedAt.
          schema: { type: string, format: date-time }
        - name: commanderId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Matching incidents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Incident' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Incidents]
      summary: Create an incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                severity: { $ref: '#/components/schemas/Severity' }
                priority: { $ref: '#/components/schemas/IncidentPriority' }
                assigneeIds:
                  type: array
                  items: { type: string, format: uuid }
                tags:
                  type: array
                  items: { type: string }
              required: [title, severity, priority]
      responses:
        "201":
          description: Incident created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}:
    get:
      tags: [Incidents]
      summary: Get an incident
      description: Includes roles (unlike the list endpoint).
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: The incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/incidents/bulk/phase:
    post:
      tags: [Incidents]
      summary: Change the NIST phase of many incidents at once
      description: >-
        Applies ChangePhase to each id in turn (one transaction per
        incident, not a single multi-row update), so every invariant that
        endpoint already enforces keeps working unmodified. A per-incident
        failure doesn't fail the whole request; the response reports one
        result per id. "post_incident" is rejected for the whole request up
        front, not per-item -- reaching it via ChangePhase alone never
        stamps closedAt (only the explicit Close action does), and
        bulk-close was explicitly descoped: closing still requires the
        single-item Close flow on the incident detail page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
                phase: { $ref: '#/components/schemas/IncidentPhase' }
              required: [ids, phase]
      responses:
        "200":
          description: Per-incident results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResponse' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/phase:
    post:
      tags: [Incidents]
      summary: Change an incident's NIST phase
      description: Jumping directly to any phase is allowed by design; a forward skip is logged, not rejected.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phase: { $ref: '#/components/schemas/IncidentPhase' }
              required: [phase]
      responses:
        "204":
          description: Phase changed
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/close:
    post:
      tags: [Incidents]
      summary: Close an incident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "204":
          description: Incident closed
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/severity-priority:
    post:
      tags: [Incidents]
      summary: Set an incident's severity and priority
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                severity: { $ref: '#/components/schemas/Severity' }
                priority: { $ref: '#/components/schemas/IncidentPriority' }
              required: [severity, priority]
      responses:
        "204":
          description: Updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/description:
    put:
      tags: [Incidents]
      summary: Edit an incident's description
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
              required: [description]
      responses:
        "204":
          description: Description updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/tags:
    put:
      tags: [Incidents]
      summary: Replace an incident's tags
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items: { type: string }
              required: [tags]
      responses:
        "204":
          description: Tags updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/assignees:
    put:
      tags: [Incidents]
      summary: Replace an incident's assignees
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigneeIds:
                  type: array
                  items: { type: string, format: uuid }
              required: [assigneeIds]
      responses:
        "204":
          description: Assignees updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/roles/{role}:
    put:
      tags: [Incidents]
      summary: Assign users to a NIST 800-61 team role
      description: >
        Role comes from the path (one of commander, incident_handler,
        communications_lead, privacy_officer, technical_lead). commander and
        technical_lead are single-assignee; an unknown role is a 400, not a
        routing 404.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: role
          in: path
          required: true
          schema: { $ref: '#/components/schemas/IncidentRole' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items: { type: string, format: uuid }
              required: [userIds]
      responses:
        "204":
          description: Role assignment updated
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/status-history:
    get:
      tags: [Incidents]
      summary: List an incident's NIST phase history
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: Phase history entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncidentStatusHistoryEntry' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/incidents/{id}/status-history/{phase}/correct:
    post:
      tags: [Incidents]
      summary: Correct a phase-entry timestamp
      description: >
        The original enteredAt is never mutated -- this fills
        correctedEnteredAt/correctedBy/correctionReason alongside it so the
        original stays intact for audit.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: phase
          in: path
          required: true
          schema: { $ref: '#/components/schemas/IncidentPhase' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enteredAt:
                  type: string
                  format: date-time
                reason:
                  type: string
              required: [enteredAt, reason]
      responses:
        "204":
          description: Correction recorded
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/timeline:
    get:
      tags: [Incidents]
      summary: Get an incident's full audit timeline
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncidentEvent' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/incidents/{id}/comments:
    get:
      tags: [Incidents]
      summary: List Team Notes comments on an incident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncidentComment' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Incidents]
      summary: Add a Team Notes comment to an incident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                imageUrl: { type: string, nullable: true }
              required: [body]
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentComment' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/incidents/{id}/iocs:
    get:
      tags: [Incidents]
      summary: List Indicators of Compromise recorded against an incident
      description: >-
        Newest-identified-first. These are the same IOCs pulled into both
        GET .../postmortem and GET .../report.pdf automatically -- nothing
        further is needed to have one recorded here show up in either
        document.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: IOCs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IOC' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Incidents]
      summary: Record a new Indicator of Compromise against an incident
      description: Append-only -- there is no update or delete route for an individual IOC.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { $ref: '#/components/schemas/IOCType' }
                value: { type: string }
                description: { type: string }
                identifiedAt: { type: string, format: date-time }
              required: [type, value, identifiedAt]
      responses:
        "201":
          description: IOC recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IOC' }
        "400":
          description: Malformed request, an unrecognized type, an empty value, or a missing identifiedAt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/alerts:
    get:
      tags: [Incidents]
      summary: List alerts linked to this incident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: Linked alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/incidents/{id}/alerts/{alertId}:
    put:
      tags: [Incidents]
      summary: Link an alert to this incident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: alertId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Linked
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Incidents]
      summary: Unlink an alert from this incident
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - name: alertId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Unlinked
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/incidents/{id}/analyze:
    post:
      tags: [Incidents]
      summary: Start "Analyze with AI" on this incident
      description: >-
        Asynchronous -- same 202-and-poll-the-transcript shape as
        POST /api/v1/alerts/{id}/analyze, see that entry's description. 409
        if a run is already in progress or paused for this incident.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "202":
          description: Analysis started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: running }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/incidents/{id}/analyze/messages:
    get:
      tags: [Incidents]
      summary: Get this incident's AI analysis chat transcript
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: The chat transcript
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatTranscript' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Incidents]
      summary: Continue this incident's AI analysis chat
      description: >-
        Same shape as POST /api/v1/alerts/{id}/analyze/messages, see that
        entry's description.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
              required: [text]
      responses:
        "202":
          description: Message accepted, next turn started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: running }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'

  /api/v1/incidents/{id}/analyze/tool-calls/{callId}/approve:
    post:
      tags: [Incidents]
      summary: Approve a tool call this incident's analysis chat is paused on
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - $ref: '#/components/parameters/ToolCallId'
      responses:
        "204":
          description: Approved (and executed); the run resumes in the background
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No such tool call, or it doesn't belong to this incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/incidents/{id}/analyze/tool-calls/{callId}/reject:
    post:
      tags: [Incidents]
      summary: Reject a tool call this incident's analysis chat is paused on
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - $ref: '#/components/parameters/ToolCallId'
      responses:
        "204":
          description: Rejected; the run resumes in the background
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No such tool call, or it doesn't belong to this incident
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/incidents/{id}/postmortem:
    get:
      tags: [Incidents]
      summary: Download a Markdown postmortem document for this incident
      description: >-
        Unlike the PDF report (which is a factual export available at any
        phase), this is a narrative closing document -- see
        PostmortemService.Generate. Streamed as a forced download, not a
        JSON envelope.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: The Markdown postmortem
          content:
            text/markdown:
              schema:
                type: string
                format: binary
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/incidents/{id}/report.pdf:
    get:
      tags: [Incidents]
      summary: Download a PDF report of this incident
      description: >-
        A point-in-time factual export -- title, severity/priority, current
        phase, the full phase-history timeline with durations, team roles,
        description, tags, linked alerts (summary), and team notes.
        Available at any phase, unlike the Markdown postmortem (which is
        offered only once the incident reaches post_incident). Streamed as
        a forced download, not a JSON envelope.
      parameters:
        - $ref: '#/components/parameters/IncidentId'
      responses:
        "200":
          description: The PDF report
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------- Playbooks
  /api/v1/playbooks:
    get:
      tags: [Playbooks]
      summary: List playbooks
      description: Not gated by resourceAccess -- shared reference material for both alerts and incidents.
      responses:
        "200":
          description: Playbooks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Playbook' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Playbooks]
      summary: Create a playbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePlaybookRequest'
      responses:
        "201":
          description: Playbook created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playbook' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/playbooks/{id}:
    get:
      tags: [Playbooks]
      summary: Get a playbook
      parameters:
        - $ref: '#/components/parameters/PlaybookId'
      responses:
        "200":
          description: The playbook
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playbook' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Playbooks]
      summary: Update a playbook
      parameters:
        - $ref: '#/components/parameters/PlaybookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePlaybookRequest'
      responses:
        "200":
          description: Playbook updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playbook' }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Playbooks]
      summary: Delete a playbook
      parameters:
        - $ref: '#/components/parameters/PlaybookId'
      responses:
        "204":
          description: Playbook deleted
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /api/v1/playbooks/match:
    get:
      tags: [Playbooks]
      summary: Find the best-matching playbook for an alert title
      description: Backs the "Related Playbook" auto-suggestion panel on Alert Detail.
      parameters:
        - name: title
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Best match, or null if no playbook's keywords match
          content:
            application/json:
              schema:
                type: object
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/Playbook'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/playbooks/steps/{stepId}/trigger:
    post:
      tags: [Playbooks]
      summary: Fire a playbook step's configured outbound webhook
      description: >-
        Sends the real outbound POST configured on this playbook step,
        against the given alert -- see PlaybookService.TriggerStepWebhook.
        502 (not 400/500) is deliberate: a failure here is the receiving
        webhook's own problem, not a malformed request or a KuruOps bug.
      parameters:
        - name: stepId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alertId: { type: string, format: uuid }
              required: [alertId]
      responses:
        "204":
          description: Webhook fired successfully
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "502":
          description: The step's configured webhook request failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------------------ Tags
  /api/v1/tags:
    get:
      tags: [Tags]
      summary: List the tag catalog
      description: Read-only, any authenticated user. Managing the catalog is admin-only, see /settings/tags.
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tag' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  # --------------------------------------------------------------- Uploads
  /api/v1/uploads/images:
    post:
      tags: [Uploads]
      summary: Upload an evidence image
      description: >
        multipart/form-data with fields kind ("alert" or "incident"), id (the
        alert/incident UUID), and file (PNG/JPEG/GIF/WebP, sniffed
        server-side, max 5MB). Any authenticated user.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [alert, incident]
                id:
                  type: string
                  format: uuid
                file:
                  type: string
                  format: binary
              required: [kind, id, file]
      responses:
        "201":
          description: File stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: Path to GET the file back, e.g. /api/v1/uploads/images/Alert/2026/08/07/<id>_<slug>/<uuid>.png
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Referenced alert/incident not found or not visible to the caller's tag scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/uploads/images/{key}:
    get:
      tags: [Uploads]
      summary: Fetch a stored evidence image
      description: >
        The path after /images/ is the full object key (multiple "/"-separated
        segments: Alert|Incident/yyyy/mm/dd/<id>_<slug>/<uuid>.<ext>),
        represented here as a single opaque path parameter.
      parameters:
        - name: key
          in: path
          required: true
          description: Full object key, e.g. Alert/2026/08/07/3f2c.../3d9e....png
          schema: { type: string }
      responses:
        "200":
          description: Image bytes
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "400":
          description: Key fails the expected shape validation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  # ----------------------------------------------------------------- Users
  /api/v1/users/directory:
    get:
      tags: [Users]
      summary: Minimal {id, name} user directory
      description: >
        Any authenticated user, deliberately not under the admin-gated
        /settings/users -- used to resolve a display name for a userID (e.g.
        Incident.Assignees) or populate an assignee picker, without exposing
        role/email/resourceAccess.
      responses:
        "200":
          description: User summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserSummary' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  # ------------------------------------------------------------- Dashboard
  /api/v1/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: KPI cards, trend charts, and breakdowns
      description: Not gated by resourceAccess -- blends alert and incident KPIs into one summary.
      parameters:
        - name: alertSeverity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: alertStatus
          in: query
          schema: { $ref: '#/components/schemas/AlertStatus' }
        - name: alertSource
          in: query
          schema: { type: string }
        - name: alertTag
          in: query
          schema: { type: string }
        - name: assignedAnalystId
          in: query
          schema: { type: string, format: uuid }
        - name: incidentSeverity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: incidentTag
          in: query
          schema: { type: string }
        - name: commanderId
          in: query
          schema: { type: string, format: uuid }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardStats' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/dashboard/activity:
    get:
      tags: [Dashboard]
      summary: Recent Activity feed
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
        - name: kind
          in: query
          description: Filter to "alert" or "incident" activity; omit for both.
          schema: { type: string, enum: [alert, incident] }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Activity events, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityEvent' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/v1/dashboard/followup:
    get:
      tags: [Dashboard]
      summary: Follow-up view (SLA-breached incidents + escalated/investigating alerts)
      description: Requires the "followup" resourceAccess capability, gated independently of "alerts"/"incidents".
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Follow-up view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowupView' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Events
  /api/v1/events/stream:
    get:
      tags: [Events]
      summary: Live alert/incident event stream (SSE)
      description: >
        text/event-stream, long-lived. Not gated by resourceAccess -- same
        reasoning as /dashboard. Each event is `event: <type>\ndata:
        <json>\n\n`; a `: ping\n\n` comment is sent every 25s to keep the
        connection alive through intermediate proxies.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          description: Streaming unsupported by the response writer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------ Settings: Webhooks
  /api/v1/settings/webhooks:
    get:
      tags: [Settings - Webhooks]
      summary: List webhook endpoints
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Webhook endpoints
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookEndpoint' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Settings - Webhooks]
      summary: Create a webhook endpoint
      description: The bearer token is returned once, in this response only -- never retrievable again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                source: { type: string }
                expiresInDays:
                  type: integer
                  nullable: true
                  description: Omitted/null -> default 90d; 0 or negative -> never expires.
              required: [name, source]
      responses:
        "201":
          description: Endpoint created
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint: { $ref: '#/components/schemas/WebhookEndpoint' }
                  token: { type: string }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/webhooks/{id}/regenerate:
    post:
      tags: [Settings - Webhooks]
      summary: Regenerate a webhook endpoint's token
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInDays:
                  type: integer
                  nullable: true
      responses:
        "200":
          description: New token (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/webhooks/{id}/disable:
    post:
      tags: [Settings - Webhooks]
      summary: Disable a webhook endpoint
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        "204":
          description: Disabled
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/webhooks/{id}/enable:
    post:
      tags: [Settings - Webhooks]
      summary: Re-enable a webhook endpoint
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      responses:
        "204":
          description: Enabled
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/webhooks/{id}/field-mapping-template:
    put:
      tags: [Settings - Webhooks]
      summary: Assign (or clear) this endpoint's Field Mapping Template
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Null clears the association -- the endpoint goes back to only the sender's own top-level "metadata" object.
              required: [templateId]
      responses:
        "204":
          description: Assigned/cleared
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /api/v1/settings/webhooks/{id}/group-by-fields:
    put:
      tags: [Settings - Webhooks]
      summary: Set (or clear) this endpoint's dedup group-by fields
      parameters:
        - $ref: '#/components/parameters/WebhookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupByFields:
                  type: array
                  items: { type: string }
                  description: Empty array turns dedup back off for this endpoint entirely.
                dedupWindowMinutes:
                  type: integer
                  nullable: true
                  description: Omitted/null or <= 0 falls back to the service default (30).
              required: [groupByFields]
      responses:
        "204":
          description: Set/cleared
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

