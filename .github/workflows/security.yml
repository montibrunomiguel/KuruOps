name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight

# A new push to the same PR/branch supersedes whatever's still running for
# it -- no point burning runner minutes finishing a scan of a commit that's
# already been replaced. Scoped to the ref (not the whole workflow) so
# separate branches/PRs still run fully in parallel.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Explicit least-privilege default -- none of these jobs push commits,
# comment on PRs, or otherwise need more than reading the checked-out code.
permissions:
  contents: read

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # ".x" on purpose, and neither of the two obvious alternatives.
          #
          # A bare minor pin ('1.25') silently desynced when Dependabot
          # raised go.mod's directive to 1.26 -- every Go job then failed
          # with "go.mod requires go >= 1.26.0 (running go 1.25.14)".
          #
          # go-version-file: backend/go.mod looks like the fix and is worse:
          # the directive is a FLOOR, not a recommendation, so the action
          # installs exactly that patch. go.mod says 1.26.0, whose standard
          # library carries five known vulnerabilities fixed in 1.26.6 --
          # govulncheck reports zero on 1.26.6 and five on 1.26.0. Tracking
          # the file would pin CI to the unpatched release.
          #
          # "1.26.x" takes the newest patch of the minor the module needs.
          # When go.mod moves to a new MINOR this needs moving too, and the
          # failure says so by name, which is the loud kind.
          go-version: '1.26.x'
          # Without this, setup-go resolves ".x" against the runner image's
          # tool cache first and uses whatever patch happens to be baked in
          # there -- 1.26.8 on 2026-10-15, while the manifest already listed
          # 1.26.9, which fixes 11 standard-library vulnerabilities
          # govulncheck then (correctly) reported. check-latest makes it ask
          # the manifest for the newest patch instead, so "newest patch" is
          # what this job actually gets and a stale image can't fail the scan.
          check-latest: true
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          cd backend
          govulncheck ./...

  npm-audit:
    name: Node.js Package Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    # Job-level, overriding the workflow's read-only default for this job
    # only. gitleaks-action v3 writes its findings back onto the pull
    # request, so with contents:read alone it dies on
    # "RequestError [HttpError]: Resource not accessible by integration"
    # (403) -- after the scan itself has already run, which makes it look
    # like a scan failure rather than a permissions one.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # gitleaks scans history, not just the working tree -- a secret
          # that was committed and later removed is still a secret. The
          # default shallow clone would hide exactly that.
          fetch-depth: 0

      # Pinned by digest-bearing tag rather than @latest for the same reason
      # trivy-action is pinned below: a scanner should not change behaviour
      # from under a build without anyone reviewing it.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          # Required since gitleaks-action v2's breaking change: scanning a
          # pull request needs a token to read the PR's commit range.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # The action nags for a licence key on org-owned repos; it is not
          # required for public ones. Set GITLEAKS_LICENSE as a repository
          # secret if this ever moves under an organisation.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  container-scan:
    name: Container Image Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kuruops-api
            dockerfile: backend/Dockerfile
            target: api
          - image: kuruops-ingest
            dockerfile: backend/Dockerfile
            target: ingest
          - image: kuruops-worker
            dockerfile: backend/Dockerfile
            target: worker
          - image: kuruops-frontend
            dockerfile: frontend/Dockerfile
            target: ""
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Repo-root context on every image, matching how docker-compose.yml
      # itself builds them -- both Dockerfiles reach outside their own
      # subdirectory (backend/Dockerfile copies db/migrations, frontend/
      # Dockerfile copies docs/oncall-rotation-fixtures.json).
      - name: Build ${{ matrix.image }}
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }} \
            -t ${{ matrix.image }}:scan \
            .

      - name: Scan ${{ matrix.image }} with Trivy
        # Pinned to a release tag, not @master -- @master is a moving
        # target (a floating branch ref, not a version), so a scanner
        # action of all things shouldn't be one unreviewed upstream commit
        # away from silently changing behavior on every run.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  # The weekly scheduled run is the only thing that catches a NEW advisory
  # against dependencies nobody has touched: a push-triggered scan only runs
  # when someone is already looking at the PR. When it failed on 2026-10-12 it
  # just sat red on main for three days, because a red scheduled run notifies
  # nobody who is not already watching the Actions tab. This job turns that
  # into an open issue (and closes it again when a later run is clean), so the
  # failure arrives where work is actually tracked.
  #
  # Scheduled runs only: on a PR the author is already looking at the checks,
  # and an issue per red PR would be noise.
  schedule-report:
    name: Report Scheduled Scan Result
    needs: [govulncheck, npm-audit, secret-scan, container-scan]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    # Job-level grant: the workflow default (contents: read) stays untouched for
    # every scanning job above, which have no business writing anything.
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: 'Security Scan is failing on main'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
    steps:
      - name: Open, update or close the tracking issue
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')

          if [ "$FAILED" = "true" ]; then
            body="The scheduled Security Scan failed on \`main\`: $RUN_URL

          A scheduled run exists to catch a *newly published* advisory against a dependency or base image nobody touched, so the cause is usually an upgrade away. Open the failing job for the exact package and the fixed version."
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "The scheduled Security Scan is clean again: $RUN_URL"
          fi
