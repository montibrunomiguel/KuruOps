name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          cd backend
          govulncheck ./...

  npm-audit:
    name: Node.js Package Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high

  container-scan:
    name: Container Image Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: argusops-api
            dockerfile: backend/Dockerfile
            target: api
          - image: argusops-ingest
            dockerfile: backend/Dockerfile
            target: ingest
          - image: argusops-worker
            dockerfile: backend/Dockerfile
            target: worker
          - image: argusops-frontend
            dockerfile: frontend/Dockerfile
            target: ""
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Repo-root context on every image, matching how docker-compose.yml
      # itself builds them -- both Dockerfiles reach outside their own
      # subdirectory (backend/Dockerfile copies db/migrations, frontend/
      # Dockerfile copies docs/oncall-rotation-fixtures.json).
      - name: Build ${{ matrix.image }}
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }} \
            -t ${{ matrix.image }}:scan \
            .

      - name: Scan ${{ matrix.image }} with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
