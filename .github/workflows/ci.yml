name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to the same PR/branch supersedes whatever's still running for
# it -- see security.yml's identical concurrency group for the same
# reasoning, kept as two separate groups (not one shared across both
# workflows) so a Security Scan run in progress never gets cancelled by an
# unrelated CI push and vice versa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Explicit least-privilege default -- none of these jobs push commits,
# comment on PRs, or otherwise need more than reading the checked-out code.
permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # ".x" on purpose, and neither of the two obvious alternatives.
          #
          # A bare minor pin ('1.25') silently desynced when Dependabot
          # raised go.mod's directive to 1.26 -- every Go job then failed
          # with "go.mod requires go >= 1.26.0 (running go 1.25.14)".
          #
          # go-version-file: backend/go.mod looks like the fix and is worse:
          # the directive is a FLOOR, not a recommendation, so the action
          # installs exactly that patch. go.mod says 1.26.0, whose standard
          # library carries five known vulnerabilities fixed in 1.26.6 --
          # govulncheck reports zero on 1.26.6 and five on 1.26.0. Tracking
          # the file would pin CI to the unpatched release.
          #
          # "1.26.x" takes the newest patch of the minor the module needs.
          # When go.mod moves to a new MINOR this needs moving too, and the
          # failure says so by name, which is the loud kind.
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          # setup-task looks the release up through the GitHub API. Without a
          # token it shares the runner's shared unauthenticated budget and
          # fails with "API rate limit exceeded" at random -- which is how
          # this job started failing in 11 seconds.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Formatting (gofmt)
        run: |
          cd backend
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: |
          cd backend
          go vet ./...

      # install-mode: goinstall builds golangci-lint with the Go toolchain
      # set up above (1.25) instead of downloading golangci-lint's official
      # prebuilt binary, which is still built with go1.24 as of the latest
      # v1.x release (v1.64.8, the last one before the v2 config-schema
      # rewrite) -- that older binary refuses to lint a `go 1.25` module
      # ("the Go language version used to build golangci-lint is lower than
      # the targeted Go version").
      # Held at v6 deliberately. The action's v7+ line drives golangci-lint
      # v2, whose config schema is a rewrite -- backend/.golangci.yml is a
      # v1 config, so the v9 bump made the job fail outright trying to fetch
      # a v2 module path at a v1 version. Moving to golangci-lint v2 means
      # migrating that config, which is its own piece of work; until then
      # this pin has to stay, and a Dependabot PR raising it should be
      # closed rather than merged.
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          working-directory: backend
          args: --timeout=5m

      - name: Build Binaries
        run: |
          cd backend
          go build -v ./cmd/api
          go build -v ./cmd/ingest
          go build -v ./cmd/worker

      # Runs the exact same Taskfile target a developer runs locally: brings
      # up Postgres via docker compose, creates+migrates a dedicated
      # kuruops_test database with the real least-privilege app/worker
      # roles, runs the full unit+integration suite with coverage, then
      # fails the build if coverage dropped below backend/coverage-baseline.txt.
      # Previously this job only ran `go test ./...` with no Postgres
      # service, so every integration test self-skipped and CI silently
      # gated on ~18% coverage instead of the ~77% the full suite reaches.
      - name: Integration Tests + Coverage Gate
        run: task backend:test:coverage-gate

  frontend-ci:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Must satisfy the toolchain's own engines range, and should match
          # frontend/Dockerfile's base image so CI tests on the runtime the
          # image ships. Vitest 5 declares
          # "node ^22.12.0 || ^24.0.0 || >=26.0.0"; this sat at 20 after
          # Dependabot moved the Dockerfile to node:26, and every test file
          # failed with "[vitest-pool]: Failed to start ... worker" -- a
          # message that says nothing about the Node version causing it.
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Lint (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Tests (Vitest)
        run: |
          cd frontend
          npm test -- --run --coverage

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  dbmigrate-ci:
    name: External DB Migration (dbmigrate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # ".x" on purpose, and neither of the two obvious alternatives.
          #
          # A bare minor pin ('1.25') silently desynced when Dependabot
          # raised go.mod's directive to 1.26 -- every Go job then failed
          # with "go.mod requires go >= 1.26.0 (running go 1.25.14)".
          #
          # go-version-file: backend/go.mod looks like the fix and is worse:
          # the directive is a FLOOR, not a recommendation, so the action
          # installs exactly that patch. go.mod says 1.26.0, whose standard
          # library carries five known vulnerabilities fixed in 1.26.6 --
          # govulncheck reports zero on 1.26.6 and five on 1.26.0. Tracking
          # the file would pin CI to the unpatched release.
          #
          # "1.26.x" takes the newest patch of the minor the module needs.
          # When go.mod moves to a new MINOR this needs moving too, and the
          # failure says so by name, which is the loud kind.
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x
          # setup-task looks the release up through the GitHub API. Without a
          # token it shares the runner's shared unauthenticated budget and
          # fails with "API rate limit exceeded" at random -- which is how
          # this job started failing in 11 seconds.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # internal/dbmigrate (the Settings -> external-database-migration
      # feature: raw COPY BINARY streaming, FK-dependency-ordered table
      # copying, role creation) had its own integration test suite gated
      # behind TEST_MIGRATION_TARGET_ENABLED and only ever run manually via
      # `task backend:test:migration` -- meaning it had zero CI signal, on
      # this or any other branch, until this job. `task db:test:up` first
      # brings up the main postgres container + a migrated kuruops_test
      # (backend:test:migration's own deps assume it's already running,
      # same as every other backend:test:* task in this file); `task
      # backend:test:migration` then also brings up a second, standalone
      # Postgres container (postgres-target) to stand in for the "external"
      # database being migrated from.
      - name: Run dbmigrate integration test
        run: |
          task db:test:up
          task backend:test:migration

  k8s-manifests-ci:
    name: Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # kubeconform is a static validator: it checks each manifest against
      # the real Kubernetes OpenAPI schema for its apiVersion/kind without
      # needing a live cluster or even a kubeconfig at all (unlike `kubectl
      # apply --dry-run=client`, which still tries to reach an API server
      # for resource discovery and fails outright with no cluster
      # configured). Cheap enough to run on every PR, and it's the only
      # thing standing between a typo in deploy/k8s/*.yaml and it only being
      # discovered at actual deploy time.
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: kubeconform -strict -summary deploy/k8s/*.yaml
