name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to the same PR/branch supersedes whatever's still running for
# it -- see security.yml's identical concurrency group for the same
# reasoning, kept as two separate groups (not one shared across both
# workflows) so a Security Scan run in progress never gets cancelled by an
# unrelated CI push and vice versa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Explicit least-privilege default -- none of these jobs push commits,
# comment on PRs, or otherwise need more than reading the checked-out code.
permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Check Formatting (gofmt)
        run: |
          cd backend
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: |
          cd backend
          go vet ./...

      # install-mode: goinstall builds golangci-lint with the Go toolchain
      # set up above (1.25) instead of downloading golangci-lint's official
      # prebuilt binary, which is still built with go1.24 as of the latest
      # v1.x release (v1.64.8, the last one before the v2 config-schema
      # rewrite) -- that older binary refuses to lint a `go 1.25` module
      # ("the Go language version used to build golangci-lint is lower than
      # the targeted Go version").
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          working-directory: backend
          args: --timeout=5m

      - name: Build Binaries
        run: |
          cd backend
          go build -v ./cmd/api
          go build -v ./cmd/ingest
          go build -v ./cmd/worker

      # Runs the exact same Taskfile target a developer runs locally: brings
      # up Postgres via docker compose, creates+migrates a dedicated
      # kuruops_test database with the real least-privilege app/worker
      # roles, runs the full unit+integration suite with coverage, then
      # fails the build if coverage dropped below backend/coverage-baseline.txt.
      # Previously this job only ran `go test ./...` with no Postgres
      # service, so every integration test self-skipped and CI silently
      # gated on ~18% coverage instead of the ~77% the full suite reaches.
      - name: Integration Tests + Coverage Gate
        run: task backend:test:coverage-gate

  frontend-ci:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Lint (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Tests (Vitest)
        run: |
          cd frontend
          npm test -- --run --coverage

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  dbmigrate-ci:
    name: External DB Migration (dbmigrate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      # internal/dbmigrate (the Settings -> external-database-migration
      # feature: raw COPY BINARY streaming, FK-dependency-ordered table
      # copying, role creation) had its own integration test suite gated
      # behind TEST_MIGRATION_TARGET_ENABLED and only ever run manually via
      # `task backend:test:migration` -- meaning it had zero CI signal, on
      # this or any other branch, until this job. `task db:test:up` first
      # brings up the main postgres container + a migrated kuruops_test
      # (backend:test:migration's own deps assume it's already running,
      # same as every other backend:test:* task in this file); `task
      # backend:test:migration` then also brings up a second, standalone
      # Postgres container (postgres-target) to stand in for the "external"
      # database being migrated from.
      - name: Run dbmigrate integration test
        run: |
          task db:test:up
          task backend:test:migration

  k8s-manifests-ci:
    name: Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # kubeconform is a static validator: it checks each manifest against
      # the real Kubernetes OpenAPI schema for its apiVersion/kind without
      # needing a live cluster or even a kubeconfig at all (unlike `kubectl
      # apply --dry-run=client`, which still tries to reach an API server
      # for resource discovery and fails outright with no cluster
      # configured). Cheap enough to run on every PR, and it's the only
      # thing standing between a typo in deploy/k8s/*.yaml and it only being
      # discovered at actual deploy time.
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: kubeconform -strict -summary deploy/k8s/*.yaml
