# Nothing watched dependencies before this, which is how golang.org/x/crypto
# sat twenty days behind a published fix until a container scan caught it.
# It matters more now the project is public and other people deploy it.
#
# POLICY: a major bump is never merged without review.
#
# This is not theoretical. Fifteen PRs from this file were once merged in one
# sitting and broke the build six different ways -- react moved to 19 while
# react-dom stayed on 18, ESLint 10 dropped a transitive dependency and
# orphaned a plugin's peer range, a lint action moved to a line that drives a
# config schema this repo does not use. Every one of those was a major, and
# every one was individually reviewable.
#
# The grouping below is the first half of the policy: patch and minor travel
# together because they are routinely safe, so majors are the PRs that arrive
# alone and are meant to be read. The second half is enforcement -- branch
# protection requiring a review before merge. That setting needs a public
# repository or a paid plan; on a private free repo the API refuses it
# outright, which is exactly how fifteen PRs merged unreviewed.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(go)"
    groups:
      # One PR for the routine patch/minor churn; anything major still
      # arrives on its own so it gets read properly.
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(npm)"
    ignore:
      # TypeScript 7 is released but the lint toolchain cannot use it yet:
      # typescript-eslint's newest version still declares
      # "typescript >=4.8.4 <6.1.0", so installing TS 7 makes npm ci fail
      # outright on an unsatisfiable peer range. This was merged once and
      # broke every frontend job. Remove this entry when typescript-eslint
      # widens that range -- check with:
      #   npm view typescript-eslint@latest peerDependencies
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The workflows pin actions by release tag (see .github/workflows/
  # security.yml's note on why @master is not used), so those pins need
  # bumping too or they quietly rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(actions)"
    ignore:
      # golangci-lint-action v7+ drives golangci-lint v2, whose config schema
      # is a rewrite; backend/.golangci.yml is a v1 config. Merging this bump
      # makes the lint job fail outright trying to fetch a v2 module path at
      # a v1 version. Migrating the config is real work with its own PR --
      # until then there is no point reopening this every week for someone to
      # merge again. Remove this entry as part of that migration.
      - dependency-name: golangci/golangci-lint-action
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(docker)"
